# Default service configuration. Override per-environment with config.<profile>.yaml
# (loaded when APP_PROFILE=<profile>) or environment variables; env keys are
# uppercased with dots/dashes flattened to underscores, e.g.
#   REGISTRATION_OTP_LENGTH=8
#   DB_URL=postgres://...

server:
  port: 8080

db:
  # Postgres URL (pgx-native). Override via DB_URL env var.
  url: postgres://serpapp:serp1234@35.200.255.84:5432/credit?sslmode=disable&search_path=report
  max-pool-size: 10
  min-idle: 2

mail:
  host: ""        # empty -> log-only stub (OTP printed to stdout)
  port: 587
  username: ""
  password: ""
  from: "Scorr.club <noreply@scorr.club>"

auth:
  # HS256 signing secret for login JWTs. OVERRIDE in prod via AUTH_JWT_SECRET.
  jwt-secret: "dev-insecure-change-me"
  jwt-ttl: 720h   # 30 days
  # Google OAuth ID-token login. Set to the "Web application" OAuth client ID
  # from Google Cloud Console; both the Android and iOS Google Sign-In SDKs
  # must use it as serverClientID so all ID tokens share one `aud`.
  # Override via AUTH_GOOGLE_CLIENT_ID. Empty -> Google login disabled (503).
  google:
    client-id: ""
  otp:
    length: 6
    ttl: 10m
    resend-cooldown: 60s
    max-attempts: 5
    max-sends: 5

multipart:
  max-file-size: 5MB
  max-request-size: 10MB

cashfree:
  mode: sandbox            # sandbox | production
  # Credentials from the Cashfree merchant dashboard. Never commit real values:
  # set them in the gitignored config.dev.yaml, or via CASHFREE_CLIENT_ID /
  # CASHFREE_CLIENT_SECRET. Empty client-id -> log-only stub gateway.
  client-id: ""
  client-secret: ""
  api-version: "2025-01-01"
  # Browser redirect after payment; "{order_id}" is replaced with our order uid.
  return-url: "http://localhost:3000/payment/result?order_id={order_id}"
  # Public HTTPS URL of POST /api/payments/cashfree/webhook. Empty -> webhooks
  # must be configured in the Cashfree dashboard instead.
  notify-url: ""
  timeout: 15s

registration:
  pan-image-dir: ./data/pan-images
  otp:
    length: 6
    ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
    max-sends: 5
  pan:
    name-match-distance: 2
  ocr:
    provider: stub          # stub | google-vision
    min-confidence: 0.8

digitap:
  # Digitap Credit Analytics API (spec V2.7). Override credentials via env:
  #   DIGITAP_CLIENT_ID, DIGITAP_CLIENT_SECRET
  # When client-id is empty, the service runs the upstream client in an offline
  # stub mode (no outbound HTTP) so the build/tests work without credentials.
  base-url: https://apidemo.digitap.work/
  client-id: ""
  client-secret: ""
  timeout: 30s

log:
  # Structured logging (log/slog). Override via LOG_LEVEL / LOG_FORMAT.
  # level: debug | info | warn | error (default info)
  # format: text (human-readable, good for dev) | json (good for log ingestion)
  level: info
  format: text
