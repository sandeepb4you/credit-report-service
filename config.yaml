# Default service configuration. Override per-environment with config.<profile>.yaml
# (loaded when APP_PROFILE=<profile>) or environment variables; env keys are
# uppercased with dots/dashes flattened to underscores, e.g.
#   REGISTRATION_OTP_LENGTH=8
#   DB_URL=postgres://...

server:
  port: 8080

db:
  # Postgres URL (pgx-native). Override via DB_URL env var.
  url: postgres://serpapp:serp1234@13.207.119.240:5432/credit?sslmode=disable&search_path=report
  max-pool-size: 10
  min-idle: 2

mail:
  host: ""        # empty -> log-only stub (OTP printed to stdout)
  port: 587
  username: ""
  password: ""
  from: "Scorr.club <noreply@scorr.club>"

sms:
  # Transactional SMS (the phone sign-in OTP). MSG91 v5 Flow API.
  #
  # msg91 | stub. "stub" never contacts the provider and sends nothing, whatever
  # auth-key is set — that is how a local run avoids texting real people while
  # real credentials sit in the gitignored config.dev.yaml. An empty auth-key
  # falls back to the stub too.
  provider: msg91
  msg91:
    # SECRET. Empty -> stub sender: nothing is sent, and nothing is logged
    # either (no sender writes a plaintext code), so an OTP screen is then
    # completable only with the master OTP. Set it in the gitignored
    # config.dev.yaml for local work, or via SMS_MSG91_AUTH_KEY — which is how
    # every deployment gets it, out of the compose stack's env file
    # (deploy/.env.example). Never fill it in here: this file is tracked and is
    # baked into the image.
    auth-key: ""
    # MSG91 template id (SMS -> Templates in the panel), NOT the 19-digit DLT
    # template id (1777178704589774509) that template is registered under —
    # the Flow API wants MSG91's own id. Not a secret.
    # Template copy: "##OTP## is your OTP for verification on Reachout. This OTP
    # is valid for 10 minutes. Please do not share it with anyone. - Reachout"
    template-id: "6a845b1f9fa9adf1da0c06d3"
    sender-id: "REAOUT"
    otp-var: "OTP"
    # Android SMS auto-read (Google SMS Retriever) needs the message to END with
    # the app's 11-char signature hash. The approved template above has no
    # trailing placeholder, so this stays empty and the app falls back to manual
    # entry. To enable: get a template ending in a variable, then set both keys.
    # See docs/sms-otp.md.
    app-signature: ""
    app-signature-var: ""
    base-url: ""              # leave empty for https://control.msg91.com/api/v5
    timeout: 15s

auth:
  # HS256 signing secret for login JWTs. OVERRIDE in prod via AUTH_JWT_SECRET.
  jwt-secret: "dev-insecure-change-me"
  # Access JWT lifetime. This is also the revocation lag (a revoked device keeps
  # working until its access token expires), so keep it SHORT in production —
  # clients refresh silently on 401. Lengthened to 1 week here for convenient
  # manual testing. Override in prod via AUTH_ACCESS_TTL (e.g. 15m).
  access-ttl: 168h   # 1 week
  # Refresh token lifetime: how long a device stays signed in without re-login.
  refresh-ttl: 720h  # 30 days
  # Google OAuth ID-token login. Set to the "Web application" OAuth client ID
  # from Google Cloud Console; both the Android and iOS Google Sign-In SDKs
  # must use it as serverClientID so all ID tokens share one `aud`.
  # Override via AUTH_GOOGLE_CLIENT_ID. Empty -> Google login disabled (503).
  google:
    client-id: ""
  otp:
    length: 4
    ttl: 10m
    resend-cooldown: 30s
    # The keyspace at length 4 is 10,000, so THIS is what makes the code safe,
    # not the digit count. Treat it as a security control.
    max-attempts: 5
    max-sends: 5
    # A fixed code accepted in place of any real OTP, on every flow. Empty here
    # on purpose: this file is tracked and baked into the image, so the shipped
    # value is "no bypass".
    #
    # Set it in the gitignored config.dev.yaml (or AUTH_OTP_MASTER_CODE) to
    # complete an OTP screen on a machine with no SMS/SMTP provider — no sender
    # ever logs the real code. config.Load REFUSES TO START the service if it is
    # set under any APP_PROFILE other than dev/local, so it cannot reach a
    # deployment by accident.
    master-code: ""

multipart:
  max-file-size: 5MB
  max-request-size: 10MB

cashfree:
  mode: sandbox            # sandbox | production
  # Credentials from the Cashfree merchant dashboard. Never commit real values:
  # set them in the gitignored config.dev.yaml, or via CASHFREE_CLIENT_ID /
  # CASHFREE_CLIENT_SECRET. Empty client-id -> log-only stub gateway.
  client-id: ""
  client-secret: ""
  api-version: "2025-01-01"
  # Browser redirect after payment; "{order_id}" is replaced with our order uid.
  return-url: "http://localhost:3000/payment/result?order_id={order_id}"
  # Public HTTPS URL of POST /api/payments/cashfree/webhook. Empty -> webhooks
  # must be configured in the Cashfree dashboard instead.
  notify-url: ""
  timeout: 15s

registration:
  pan-image-dir: ./data/pan-images
  otp:
    length: 4
    ttl: 5m
    resend-cooldown: 30s
    max-attempts: 5
    max-sends: 5
  pan:
    name-match-distance: 2
    # Failed provider checks allowed per submitted PAN before the account has
    # to contact support. PAN plus a name is guessable for a known person, so
    # an uncapped retry loop is a brute-force oracle we pay for per call.
    max-verification-attempts: 3
  ocr:
    provider: stub          # stub | google-vision
    min-confidence: 0.8

digitap:
  # Digitap Credit Analytics API (spec V2.7). Override credentials via env:
  #   DIGITAP_CLIENT_ID, DIGITAP_CLIENT_SECRET
  # When client-id is empty, the service runs the upstream client in an offline
  # stub mode (no outbound HTTP) so the build/tests work without credentials.
  # Production host. It was apidemo.digitap.work until 2026-08-25, which meant
  # every environment had to override the host alongside its credentials, and
  # production credentials 401 against the demo host. Set DIGITAP_BASE_URL to
  # https://svcdemo.digitap.work/ for UAT.
  base-url: https://api.digitap.ai/
  client-id: ""
  client-secret: ""
  timeout: 30s
  # Mobile to Prefill (spec v1.4) — the PAN check at signup. A separate Digitap
  # product from Credit Analytics above, but it runs on the SAME host and the
  # SAME credential pair: leaving these empty makes the PAN check fall back to
  # digitap.client-id/-secret, which is the intended arrangement. (The v1.4 spec
  # describes a separately provisioned client id; that is out of date.) Empty
  # after the fallback runs the offline stub, which confirms nothing about the
  # real person. Override via DIGITAP_PREFILL_CLIENT_ID / _SECRET only if
  # Digitap ever does issue a distinct pair.
  prefill:
    base-url: https://api.digitap.ai/
    client-id: ""
    client-secret: ""
    timeout: 30s

utho:
  # Utho Cloud object storage — destination for the credit-report PDF relay.
  # Credit analytics sends report_type 3; Digitap returns a ~1-hour result_pdf
  # URL, which we download and re-upload here, storing the permanent URL on the
  # analytics row. Empty api-token -> stub client (fake URL, no upload); set all
  # three in any environment that should persist real PDFs.
  # Override via env: UTHO_API_TOKEN, UTHO_DC_SLUG, UTHO_BUCKET.
  api-token: ""
  dc-slug: ""
  bucket: ""
  base-url: ""              # leave empty for the default https://api.utho.com/v2
  timeout: 60s

statement:
  # Bank-statement analysis. Override via env:
  #   STATEMENT_PARSER=stub, STATEMENT_MAX_FILE_SIZE=10MB, ...
  # parser: pdf  -> the real text-layer extractor (works on digitally-generated
  #                 HDFC/ICICI/SBI/Axis PDFs; scanned PDFs fail with a clear msg).
  #          stub -> dev-only canned parser (no real PDF needed; for CI/demo).
  parser: pdf
  max-file-size: 10MB          # per-upload cap; also raise multipart.max-request-size if you go higher
  worker-concurrency: 4        # analysis goroutines (CPU-bound, not latency-sensitive)
  worker-buffer: 16            # queued jobs beyond the in-flight ones
  process-timeout: 2m          # per-job ceiling so a bad PDF can't pin a worker

  # provider picks the RECOMMENDED flow; both endpoints stay available either way.
  #   local   -> client uploads a PDF (POST /api/bank-statements/analyze); we parse it.
  #   digitap -> redirect/upload via Digitap's UI (POST /api/bank-statements/digitap/initiate);
  #              the PDF goes straight to Digitap and we store their report.
  provider: local

  # Optional guard on the public Digitap webhook (?secret=). Off in dev; set it
  # in prod — the API defines no HMAC in v1.20.
  callback-secret: ""
  # Default browser return URL after the Digitap UI, when the client omits it.
  default-return-url: ""

  digitap:
    # Digitap Bank Data PDF UI API (v1.20). Separate creds from digitap.* above
    # (that's the credit-analytics product). Empty client-id -> stub client, so
    # dev/CI runs the redirect flow with canned responses.
    base-url: https://svcdemo.digitap.work/bank-data/
    client-id: ""
    client-secret: ""
    # Public HTTPS URL Digitap POSTs the transaction-complete callback to.
    # Empty in dev (no public host) — the GET /:id poll fallback still completes
    # the flow. Set it (e.g. via ngrok or the load balancer) in prod.
    callback-url: ""
    timeout: 30s

log:
  # Structured logging (log/slog). Override via LOG_LEVEL / LOG_FORMAT.
  # level: debug | info | warn | error (default info)
  # format: text (human-readable, good for dev) | json (good for log ingestion)
  level: info
  format: text

demo:
  # Demo/UAT convenience flag. When true, a PAN submitted via POST /api/kyc/pan
  # is auto-verified immediately (status VERIFIED) instead of waiting for the
  # admin verify step, so the credit-analytics flow can be demoed end-to-end
  # without the external KYC provider. MUST stay false in production.
  # Override via DEMO_ENABLED=true.
  enabled: true
