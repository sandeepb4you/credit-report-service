basePath: /api
definitions:
  credit-report-service_internal_apperr.ErrorBody:
    properties:
      details: {}
      error:
        type: string
      message:
        type: string
      status:
        type: integer
      timestamp:
        type: string
    type: object
  credit-report-service_internal_models.Account:
    properties:
      createdAt:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      phone:
        type: string
      profileCompleted:
        type: boolean
      referredAt:
        type: string
      referredByAccountId:
        description: Referral attribution, set once at signup and never changed.
        type: integer
      referredByCode:
        type: string
      role:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.AgentMeta:
    properties:
      browser:
        type: string
      browserVersion:
        type: string
      deviceType:
        description: mobile | tablet | desktop
        type: string
      os:
        type: string
      osVersion:
        type: string
    type: object
  credit-report-service_internal_models.BankOffering:
    properties:
      active:
        type: boolean
      applyUrl:
        description: ApplyURL is the CTA destination for taking up the product.
        type: string
      createdAt:
        type: string
      estimatedPointsMax:
        type: integer
      estimatedPointsMin:
        description: |-
          EstimatedPointsMin/Max bound the estimated score gain. Always rendered with
          the "estimated, not guaranteed" disclaimer.
        type: integer
      id:
        type: integer
      interestRatePercent:
        description: |-
          InterestRatePercent is the FD yield for display (the deposit keeps earning
          while the card builds history). Not a borrowing rate.
        type: number
      maxCreditScore:
        type: integer
      minCreditScore:
        description: |-
          ScoreBand gates the offering: it is surfaced only when the user's score is
          within [MinCreditScore, MaxCreditScore]. Defaults 0..900 = "everyone".
        type: integer
      minFdAmount:
        description: |-
          MinFDAmount is the fixed deposit the user opens to obtain the product
          (e.g. a card against the FD). 0 when not applicable.
        type: number
      name:
        type: string
      productType:
        type: string
      revenueNote:
        description: RevenueNote is an ops-facing referral/commission note.
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.BankStatement:
    properties:
      accountId:
        type: integer
      analysis:
        description: |-
          Analysis is the derived metrics (salary, EMI, categories, ...). Nil until
          the row reaches status 'completed'. For local rows it's our Analysis
          struct; for digitap rows it's Digitap's report JSON, stored verbatim.
        items:
          type: integer
        type: array
      completedAt:
        type: string
      createdAt:
        type: string
      errorMessage:
        description: ErrorMessage is set only when Status == 'failed'.
        type: string
      extractedText:
        description: |-
          ExtractedText is the PDF text layer. Empty until the worker runs.
          Local-provider rows only; digitap rows leave this null.
        type: string
      filename:
        type: string
      id:
        type: integer
      mimeType:
        type: string
      periodEnd:
        type: string
      periodStart:
        type: string
      provider:
        description: |-
          Provider records which flow produced this row: 'local' (the client
          uploaded a PDF we parse in-process) or 'digitap' (the user uploaded to
          Digitap's UI and we fetched the report). Drives the poll fallback and how
          the client interprets the analysis payload.
        type: string
      redirectUrl:
        type: string
      requestId:
        description: |-
          Digitap-flow fields. Populated for provider='digitap' rows; null otherwise.
          RequestID/RedirectURL/URLExpiresAt are set at initiation; TxnID is filled
          in when the callback or status-check first names the transaction.
        type: string
      status:
        type: string
      transactionCount:
        type: integer
      txnId:
        type: string
      urlExpiresAt:
        type: string
    type: object
  credit-report-service_internal_models.Coupon:
    properties:
      code:
        type: string
      createdAt:
        type: string
      createdBy:
        description: CreatedBy is the issuing account — the agent this redemption
          attributes to.
        type: integer
      discountPercent:
        type: number
      id:
        type: integer
      kind:
        type: string
      maxRedemptions:
        type: integer
      perAccountLimit:
        type: integer
      productCode:
        description: ProductCode nil means the coupon applies to every product.
        type: string
      redemptionCount:
        type: integer
      revokedAt:
        type: string
      updatedAt:
        type: string
      validFrom:
        type: string
      validUntil:
        type: string
    type: object
  credit-report-service_internal_models.CreditAnalyticsRequest:
    properties:
      accountId:
        type: integer
      clientRefNum:
        type: string
      createdAt:
        type: string
      creditScore:
        description: |-
          CreditScore is the bureau score (SCORE.BureauScore) lifted out of the
          response at write time. Nil when the pull failed or returned no record.
        type: integer
      httpStatus:
        type: integer
      id:
        type: integer
      message:
        type: string
      mobileNo:
        type: string
      requestBody:
        items:
          type: integer
        type: array
      requestId:
        type: string
      responseBody:
        items:
          type: integer
        type: array
      resultCode:
        type: integer
      resultPdfUrl:
        description: |-
          ResultPDFURL is the s3:// URI of the stored PDF report, not a URL anyone
          can follow: the bucket is private, so reads are presigned at request time.
          Digitap returns a link that lives about an hour (result_pdf); we download
          it, encrypt it with the holder's PAN + date of birth and upload it
          asynchronously. Nil until that completes, if it failed (best-effort), or
          if no password could be built — an unprotectable report is not stored.
          Mirrors the creditScore lift-out.
        type: string
    type: object
  credit-report-service_internal_models.DeviceMeta:
    properties:
      agent:
        allOf:
        - $ref: '#/definitions/credit-report-service_internal_models.AgentMeta'
        description: |-
          Agent is parsed by the server from the User-Agent header. Best-effort:
          unrecognized agents leave fields empty rather than guessing.
      client:
        additionalProperties:
          type: string
        description: |-
          Client is whatever the app declared via X-Device-Info: make, model, OS
          version, app version, and any extra keys it cares to send. Free-form but
          bounded (see middleware.parseDeviceInfoHeader) because it is user input.
        type: object
    type: object
  credit-report-service_internal_models.KYCRecord:
    properties:
      aadhaarLast4:
        type: string
      aadhaarPanLinked:
        type: boolean
      aadhaarReference:
        type: string
      accountId:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      pan:
        type: string
      panName:
        type: string
      panVerified:
        type: boolean
      provider:
        type: string
      rejectionReason:
        type: string
      reviewedAt:
        type: string
      reviewedByAccountId:
        description: |-
          ReviewedByAccountID / ReviewedAt record which admin made the last
          verify-or-reject decision and when. Both are NULL until someone reviews
          the submission, and are cleared again if the applicant re-submits.
        type: integer
      status:
        type: string
      updatedAt:
        type: string
      verifiedAt:
        type: string
    type: object
  credit-report-service_internal_models.KYCReviewItem:
    properties:
      accountId:
        type: integer
      createdAt:
        description: |-
          CreatedAt is when the account first submitted a PAN; UpdatedAt is when
          the record last changed, and is what the queue is ordered by — a
          re-submitted PAN needs review again, so it belongs back at the top.
        type: string
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      pan:
        type: string
      panName:
        type: string
      phone:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.KYCReviewPage:
    properties:
      items:
        items:
          $ref: '#/definitions/credit-report-service_internal_models.KYCReviewItem'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  credit-report-service_internal_models.KYCStatus:
    properties:
      createdAt:
        description: |-
          CreatedAt is when the account first submitted a PAN; UpdatedAt is when
          the record last changed (a re-submission or a verification).
        type: string
      panLast4:
        description: |-
          PANLast4 is the tail of the PAN on file, enough for the user to recognise
          which number they submitted. Empty when nothing is on file.
        example: 234F
        type: string
      panSubmitted:
        type: boolean
      panVerified:
        type: boolean
      rejectionReason:
        description: |-
          RejectionReason is set only on a REJECTED record; it is what the client
          shows the user so they know what to correct before re-submitting.
        type: string
      status:
        description: Status is one of KycNotSubmitted / KycPending / KycVerified /
          KycRejected.
        example: PENDING
        type: string
      updatedAt:
        type: string
      verifiedAt:
        type: string
    type: object
  credit-report-service_internal_models.LoanProvider:
    properties:
      active:
        type: boolean
      createdAt:
        type: string
      id:
        type: integer
      interestRatePercent:
        type: number
      loanType:
        type: string
      maxTenureMonths:
        type: integer
      minCreditScore:
        type: integer
      name:
        type: string
      processingFeeFlat:
        type: number
      processingFeePercent:
        type: number
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.LoanSwitchSettings:
    properties:
      foreclosureFeePercentCar:
        type: number
      foreclosureFeePercentHome:
        type: number
      foreclosureFeePercentPersonal:
        type: number
      recoveryWindowMonths:
        type: integer
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.Order:
    properties:
      amount:
        description: |-
          Amount is what the customer is charged, i.e. already net of any coupon.
          DiscountAmount and CouponCode are snapshots of how it got there, so the
          list price is Amount + DiscountAmount and later edits to the coupon can
          never rewrite this order.
        type: number
      cfOrderId:
        type: string
      couponCode:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      discountAmount:
        type: number
      failureReason:
        type: string
      orderId:
        type: string
      paidAt:
        type: string
      paymentMethod:
        type: string
      paymentSessionId:
        type: string
      productCode:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.Product:
    properties:
      active:
        type: boolean
      amount:
        type: number
      code:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      description:
        description: |-
          Description is customer-facing copy: newline-separated feature lines that
          clients render as a checklist on the plans screen.
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.Profile:
    properties:
      createdAt:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      kyc:
        $ref: '#/definitions/credit-report-service_internal_models.KYCStatus'
      lastName:
        type: string
      phone:
        type: string
      profileCompleted:
        type: boolean
      referredAt:
        type: string
      referredByAccountId:
        description: Referral attribution, set once at signup and never changed.
        type: integer
      referredByCode:
        type: string
      role:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_service.AuthResult:
    properties:
      account:
        $ref: '#/definitions/credit-report-service_internal_models.Account'
      expiresAt:
        type: string
      refreshToken:
        type: string
      token:
        type: string
    type: object
  credit-report-service_internal_service.BuilderStrategy:
    properties:
      applyUrl:
        description: Product-only fields (Kind == "product"). Zero/empty otherwise.
        type: string
      detail:
        type: string
      estimatedPointsMax:
        type: integer
      estimatedPointsMin:
        type: integer
      fdAmount:
        type: number
      key:
        type: string
      kind:
        type: string
      revenueNote:
        type: string
      tag:
        type: string
      title:
        type: string
    type: object
  credit-report-service_internal_service.CardFactor:
    properties:
      detail:
        description: suggested next action
        type: string
      grade:
        description: '"A+", "A", "B", "C", "D", "F"'
        type: string
      missedCount:
        description: missed/delayed months (payment factor)
        type: integer
      name:
        description: e.g. "Payment history"
        type: string
      summary:
        description: human-readable detail line
        type: string
      weight:
        description: percent weight (e.g. 35)
        type: integer
    type: object
  credit-report-service_internal_service.CreditAnalyticsInput:
    properties:
      device_ip:
        type: string
    type: object
  credit-report-service_internal_service.DigitapInitiateResponse:
    properties:
      expiresAt:
        type: string
      id:
        type: integer
      redirectUrl:
        type: string
      requestId:
        type: string
    type: object
  credit-report-service_internal_service.LoanAccount:
    properties:
      accountNumber:
        type: string
      active:
        description: |-
          Active mirrors isActiveStatus on this tradeline's Account_Status — the same
          test that produces ActiveAccountCount, so the per-account flag and the
          summary count can never disagree. Clients split "current" from "closed
          history" on this; without it every account reads as closed.
        type: boolean
      company:
        type: string
      currentBalance:
        type: number
      interestRatePercent:
        type: number
      loanType:
        type: string
      originalLoanAmount:
        type: number
      paymentHistory:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.PaymentMonth'
        type: array
      percentagePaid:
        type: number
      remainingTenureMonths:
        type: integer
      totalTenureMonths:
        type: integer
    type: object
  credit-report-service_internal_service.PasswordResetGrant:
    properties:
      expiresAt:
        type: string
      resetToken:
        type: string
    type: object
  credit-report-service_internal_service.PaymentMonth:
    properties:
      daysLate:
        description: 0 if paid on time
        type: integer
      month:
        description: e.g. "2026-08"
        type: string
      status:
        description: '"paid", "delayed", "not_reported"'
        type: string
    type: object
  credit-report-service_internal_service.PurchaseResult:
    properties:
      amount:
        description: |-
          Amount is the charged total, already net of any coupon. OriginalAmount
          and DiscountAmount let the payment screen show the saving without
          recomputing it — and without being trusted to.
        type: number
      cfOrderId:
        type: string
      couponCode:
        type: string
      currency:
        type: string
      discountAmount:
        type: number
      mode:
        type: string
      orderId:
        type: string
      originalAmount:
        type: number
      paymentSessionId:
        type: string
      status:
        type: string
    type: object
  credit-report-service_internal_service.Quote:
    properties:
      code:
        type: string
      currency:
        type: string
      discountAmount:
        type: number
      discountPercent:
        type: number
      originalAmount:
        type: number
      payableAmount:
        type: number
      productCode:
        type: string
    type: object
  credit-report-service_internal_service.Recommendation:
    properties:
      category:
        description: Category is "score" (raise the credit score) or "interest" (cut
          interest).
        type: string
      detail:
        type: string
      estimatedPointsMax:
        type: integer
      estimatedPointsMin:
        description: |-
          EstimatedPointsMin/Max bound the estimated score gain for "score"
          recommendations (nil for "interest" ones). They are estimates, not
          promises — actual movement depends on lender reporting cycles.
        type: integer
      impact:
        description: |-
          Impact is a human-readable, deliberately non-promissory hint at the payoff
          (e.g. the current factor state, or the estimated rupee saving).
        type: string
      priority:
        type: integer
      title:
        type: string
    type: object
  credit-report-service_internal_service.ReportCard:
    properties:
      factors:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.CardFactor'
        type: array
      overallGrade:
        type: string
    type: object
  credit-report-service_internal_service.ReportInsights:
    properties:
      activeAccountCount:
        type: integer
      cardUtilizationPercent:
        type: number
      createdAt:
        description: CreatedAt is when the bureau pull ran — what a client shows as
          "checked on".
        type: string
      creditScore:
        type: integer
      derogatoryAccounts:
        description: |-
          DerogatoryAccounts counts written-off / settled / defaulted tradelines —
          the serious negatives the "good news" diagnosis checks for.
        type: integer
      enquiryCount180Days:
        type: integer
      interestPaidPerYear:
        type: number
      interestSavings:
        allOf:
        - $ref: '#/definitions/credit-report-service_internal_service.SwitchOpportunities'
        description: |-
          InterestSavings holds the balance-transfer opportunities computed from the
          report's active loans (nil when the loan-switch feature isn't wired in).
      loanAccounts:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.LoanAccount'
        type: array
      monthlyEmi:
        type: number
      onTimePaymentPercent:
        description: |-
          OnTimePaymentPercent is nil when no month of payment history was reported
          on any tradeline — which is different from 0%, and used to be indistinguishable
          from it. A thin or brand-new file showed "0% on time", read as "never paid
          anything on time", and graded the payment factor F/Critical off no data at all.
          The clients already model this as nullable and render "—".
        type: number
      outdated:
        description: |-
          Outdated is true once the report is older than reportFreshWindow. Clients
          must drive "time to refresh" off this flag rather than re-deriving it from
          CreatedAt: the window is a product decision, and two implementations of it
          would eventually disagree about whether the same report is stale.
        type: boolean
      recommendations:
        description: |-
          Recommendations is a single prioritized list of actions the user can take,
          spanning both levers: improving the score (from the report card) and
          reducing interest (from recommended switches).
        items:
          $ref: '#/definitions/credit-report-service_internal_service.Recommendation'
        type: array
      reportCard:
        $ref: '#/definitions/credit-report-service_internal_service.ReportCard'
      reportId:
        type: integer
      scoreBuilder:
        allOf:
        - $ref: '#/definitions/credit-report-service_internal_service.ScoreBuilder'
        description: |-
          ScoreBuilder is the credit-score diagnosis + rebuild plan (Journey 05·C):
          journey classification, a realistic target, the positives on file, what's
          dragging the score, and a toolkit of strategies to raise it.
      totalAccountCount:
        type: integer
      totalOutstandingAmount:
        type: number
    type: object
  credit-report-service_internal_service.ReportPage:
    properties:
      items:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.ReportSummary'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  credit-report-service_internal_service.ReportSummary:
    properties:
      createdAt:
        type: string
      creditScore:
        type: integer
      id:
        type: integer
    type: object
  credit-report-service_internal_service.ScoreBuilder:
    properties:
      currentScore:
        type: integer
      disclaimer:
        type: string
      drivers:
        description: Drivers are the factors dragging the score down (weakest first).
        items:
          $ref: '#/definitions/credit-report-service_internal_service.ScoreDriver'
        type: array
      headline:
        type: string
      journey:
        description: |-
          Journey is "rebuild" (< 650), "blended" (650–749), "protect" (>= 750), or
          "unknown" (no score on file).
        type: string
      positives:
        description: Positives are the reassuring facts found on the file (no defaults,
          etc.).
        items:
          type: string
        type: array
      strategies:
        description: Strategies is the rebuild/optimize toolkit, highest-impact first.
        items:
          $ref: '#/definitions/credit-report-service_internal_service.BuilderStrategy'
        type: array
      targetScoreMax:
        type: integer
      targetScoreMin:
        type: integer
      timelineMonthsMax:
        type: integer
      timelineMonthsMin:
        description: |-
          TimelineMonthsMin/Max bound a realistic time-to-target (0 when the plan is
          "maintain", i.e. already at target).
        type: integer
    type: object
  credit-report-service_internal_service.ScoreDriver:
    properties:
      factor:
        type: string
      grade:
        type: string
      summary:
        type: string
    type: object
  credit-report-service_internal_service.SessionView:
    properties:
      current:
        description: |-
          Current marks the session the requesting device is using right now, so
          the UI can label it and warn before revoking it.
        type: boolean
      deviceInfo:
        allOf:
        - $ref: '#/definitions/credit-report-service_internal_models.DeviceMeta'
        description: |-
          DeviceInfo is the make/model/OS breakdown, split into what the client
          declared and what the server parsed from the User-Agent.
      deviceName:
        type: string
      expiresAt:
        type: string
      id:
        type: integer
      ip:
        type: string
      lastUsedAt:
        type: string
      platform:
        type: string
      signedInAt:
        type: string
    type: object
  credit-report-service_internal_service.SignupResult:
    properties:
      accountId:
        type: integer
      email:
        type: string
      message:
        type: string
    type: object
  credit-report-service_internal_service.SimAction:
    properties:
      delta:
        description: signed score impact when selected
        type: integer
      direction:
        description: '"up" (positive) | "down" (negative)'
        type: string
      key:
        type: string
      kind:
        description: '"advice" | "product" | "event"'
        type: string
      label:
        type: string
      selected:
        description: ✓ selected (counts toward projection) vs ○ not
        type: boolean
    type: object
  credit-report-service_internal_service.Simulation:
    properties:
      actions:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.SimAction'
        type: array
      currentScore:
        type: integer
      delta:
        description: projected - current (sum of selected action deltas)
        type: integer
      disclaimer:
        type: string
      projectedScore:
        type: integer
      timeframe:
        type: string
    type: object
  credit-report-service_internal_service.StatementPage:
    properties:
      items:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.StatementSummary'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  credit-report-service_internal_service.StatementSummary:
    properties:
      completedAt:
        type: string
      createdAt:
        type: string
      filename:
        type: string
      id:
        type: integer
      periodEnd:
        type: string
      periodStart:
        type: string
      status:
        type: string
      transactionCount:
        type: integer
    type: object
  credit-report-service_internal_service.SwitchOpportunities:
    properties:
      creditScore:
        type: integer
      disclaimer:
        type: string
      opportunities:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.SwitchOpportunity'
        type: array
      recommendedCount:
        type: integer
      recoveryWindowMonths:
        type: integer
      reportId:
        type: integer
      totalMonthlyEmiSaving:
        type: number
      totalNetSaving:
        type: number
    type: object
  credit-report-service_internal_service.SwitchOpportunity:
    properties:
      accountNumber:
        type: string
      bestProvider:
        $ref: '#/definitions/credit-report-service_internal_models.LoanProvider'
      currentEmi:
        type: number
      currentLender:
        type: string
      currentRatePercent:
        type: number
      foreclosureFee:
        type: number
      loanType:
        description: HOME | PERSONAL | CAR
        type: string
      monthlyEmiSaving:
        type: number
      netSaving:
        type: number
      newEmi:
        type: number
      newRatePercent:
        type: number
      outstandingBalance:
        type: number
      processingFee:
        type: number
      reason:
        type: string
      recommended:
        type: boolean
      recoveryMonths:
        type: integer
      remainingTenureMonths:
        type: integer
      status:
        description: |-
          Status: "recommended" | "not_recommended" | "no_better_offer" |
          "insufficient_data". Reason explains the non-recommended cases.
        type: string
      switchingCost:
        type: number
      totalInterestSaving:
        type: number
    type: object
  internal_handler.ReportEmailResponse:
    properties:
      message:
        example: Your report is on its way
        type: string
    type: object
  internal_handler.ReportPDFLinkResponse:
    properties:
      expiresInSeconds:
        description: ExpiresInSeconds is how long the URL stays valid.
        example: 600
        type: integer
      passwordHint:
        description: |-
          PasswordHint states how to open the file. Sent with the link because the
          PDF is encrypted and a download nobody can open is not a download.
        type: string
      url:
        description: |-
          URL is presigned and expires. Not stored anywhere client-side: ask again
          rather than keeping it, or a stale link becomes a confusing failure.
        example: https://myscorr-credit-reports.s3.ap-south-1.amazonaws.com/...
        type: string
    type: object
  internal_handler.createCouponReq:
    properties:
      code:
        example: SAVE20
        type: string
      discountPercent:
        example: 20
        type: number
      maxRedemptions:
        example: 100
        type: integer
      perAccountLimit:
        example: 1
        type: integer
      productCode:
        example: CREDIT_ANALYSIS
        type: string
      validFrom:
        example: "2026-08-01T00:00:00Z"
        type: string
      validUntil:
        example: "2026-12-31T23:59:59Z"
        type: string
    type: object
  internal_handler.createOrderReq:
    properties:
      couponCode:
        description: |-
          CouponCode is optional. Only the code is accepted — the discount and the
          resulting total are computed server-side from the catalog price, so a
          tampered request cannot change what is charged.
        example: SAVE20
        type: string
      productCode:
        example: CREDIT_ANALYSIS
        type: string
    type: object
  internal_handler.emailLinkSendReq:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  internal_handler.emailLinkVerifyReq:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "1234"
        type: string
    type: object
  internal_handler.forgotPasswordReq:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  internal_handler.googleLoginReq:
    properties:
      idToken:
        example: eyJhbGciOiJSUzI1NiIs...
        type: string
      referralCode:
        description: ReferralCode is only honoured when this login creates a new account.
        example: REF-7K2QM4XZ
        type: string
    type: object
  internal_handler.loginReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: hunter2pass
        type: string
    type: object
  internal_handler.offeringReq:
    properties:
      active:
        example: true
        type: boolean
      applyUrl:
        example: https://apply.example.com/hdfc-fd-card
        type: string
      estimatedPointsMax:
        example: 80
        type: integer
      estimatedPointsMin:
        example: 40
        type: integer
      interestRatePercent:
        example: 7
        type: number
      maxCreditScore:
        example: 650
        type: integer
      minCreditScore:
        example: 0
        type: integer
      minFdAmount:
        example: 15000
        type: number
      name:
        example: HDFC Millennia FD-Backed Card
        type: string
      productType:
        example: FD_CARD
        type: string
      revenueNote:
        example: FD + secured-card referral
        type: string
    type: object
  internal_handler.phoneOtpSendReq:
    properties:
      phone:
        example: "+919876543210"
        type: string
    type: object
  internal_handler.phoneOtpVerifyReq:
    properties:
      otp:
        example: "1234"
        type: string
      phone:
        example: "+919876543210"
        type: string
    type: object
  internal_handler.phoneRegisterSendReq:
    properties:
      phone:
        example: "+919876543210"
        type: string
    type: object
  internal_handler.phoneRegisterVerifyReq:
    properties:
      otp:
        example: "1234"
        type: string
      phone:
        example: "+919876543210"
        type: string
    type: object
  internal_handler.providerReq:
    properties:
      active:
        example: true
        type: boolean
      interestRatePercent:
        example: 7.2
        type: number
      loanType:
        example: HOME
        type: string
      maxTenureMonths:
        example: 360
        type: integer
      minCreditScore:
        example: 750
        type: integer
      name:
        example: HDFC Bank
        type: string
      processingFeeFlat:
        example: 3000
        type: number
      processingFeePercent:
        example: 0.5
        type: number
    type: object
  internal_handler.refreshReq:
    properties:
      refreshToken:
        example: rt_8Kx3...
        type: string
    type: object
  internal_handler.rejectPanReq:
    properties:
      reason:
        example: PAN name does not match the profile name
        type: string
    type: object
  internal_handler.resendReq:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  internal_handler.resetPasswordReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: newhunter2pass
        type: string
      resetToken:
        example: prt_8Kd2...
        type: string
    type: object
  internal_handler.setRoleReq:
    properties:
      role:
        example: agent
        type: string
    type: object
  internal_handler.settingsReq:
    properties:
      foreclosureFeePercentCar:
        example: 4
        type: number
      foreclosureFeePercentHome:
        example: 0
        type: number
      foreclosureFeePercentPersonal:
        example: 4
        type: number
      recoveryWindowMonths:
        example: 12
        type: integer
    type: object
  internal_handler.signupReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: hunter2pass
        type: string
      referralCode:
        description: |-
          ReferralCode is optional and attributes the new account to whoever owns
          it. An invalid code fails the signup rather than being ignored.
        example: REF-7K2QM4XZ
        type: string
    type: object
  internal_handler.submitPanReq:
    properties:
      fullName:
        description: |-
          FullName as printed on the PAN card. Verified against the name the
          provider holds for the account's mobile number, with a small edit-distance
          tolerance — it does not have to match character for character.
        example: JOHN DOE
        type: string
      pan:
        example: ABCDE1234F
        type: string
    type: object
  internal_handler.updateProfileReq:
    properties:
      dateOfBirth:
        example: "1815-12-10"
        type: string
      firstName:
        example: Ada
        type: string
      lastName:
        example: Lovelace
        type: string
    type: object
  internal_handler.verifyEmailReq:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "1234"
        type: string
    type: object
  internal_handler.verifyResetOtpReq:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "1234"
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    REST API for the credit-report Android app: email/password auth with OTP verification, JWT sessions, profile management, and credit-report CRUD.

    All routes are mounted under `/api`. Protected routes require an `Authorization: Bearer <jwt>` header obtained from login or email verification.
  title: Credit Report Service API
  version: "1.0"
paths:
  /admin/accounts/{accountId}/role:
    put:
      consumes:
      - application/json
      description: Grants or revokes a role. 'agent' lets the account issue coupon
        codes; 'user' is the default. Note that the role rides in the JWT, so a change
        only takes effect for the target account on its next token refresh — up to
        one access-token lifetime later.
      parameters:
      - description: Account to modify
        in: path
        name: accountId
        required: true
        type: integer
      - description: Role to set (user | agent | admin)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.setRoleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Account'
        "400":
          description: Unknown role / accountId must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'account:set-role' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Set an account's role
      tags:
      - admin
  /admin/bank-offerings:
    get:
      description: Returns configured offerings, optionally filtered by productType
        (FD_CARD|SECURED_LOAN) and active. Requires 'bank-offering:manage'.
      parameters:
      - description: Filter by product type (FD_CARD, SECURED_LOAN)
        in: query
        name: productType
        type: string
      - description: Filter by active flag
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_models.BankOffering'
            type: array
        "400":
          description: Invalid productType
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'bank-offering:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List bank offerings (admin)
      tags:
      - bank-offerings
    post:
      consumes:
      - application/json
      description: 'Adds a partner product that helps a user rebuild credit (e.g.
        an FD-secured credit card): the FD amount, the FD yield, the score band it
        targets, the estimated point impact, the apply link, and a revenue note. Surfaced
        by the score-builder toolkit (S28) when the user''s score falls in the band.
        Requires the ''bank-offering:manage'' permission.'
      parameters:
      - description: Bank offering
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.offeringReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.BankOffering'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'bank-offering:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a score-builder bank offering (admin)
      tags:
      - bank-offerings
  /admin/bank-offerings/{id}:
    delete:
      parameters:
      - description: Offering id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Bank offering deleted\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'bank-offering:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Bank offering not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete a bank offering (admin)
      tags:
      - bank-offerings
    get:
      parameters:
      - description: Offering id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.BankOffering'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'bank-offering:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Bank offering not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Fetch a bank offering by id (admin)
      tags:
      - bank-offerings
    put:
      consumes:
      - application/json
      description: Replaces the mutable fields of an offering. Requires 'bank-offering:manage'.
      parameters:
      - description: Offering id
        in: path
        name: id
        required: true
        type: integer
      - description: Bank offering
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.offeringReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.BankOffering'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'bank-offering:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Bank offering not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update a bank offering (admin)
      tags:
      - bank-offerings
  /admin/kyc/pan/{accountId}/reject:
    post:
      consumes:
      - application/json
      description: Marks the named account's KYC row as REJECTED and records why.
        The reason is required and is shown to the account holder via GET /api/kyc/status,
        so it should say what to correct. Rejecting an already-verified account withdraws
        its access — pan_verified is cleared, so it can no longer request credit analytics.
        The account can re-submit a PAN, which returns the row to PENDING and clears
        the reason.
      parameters:
      - description: Account id whose KYC is being rejected
        in: path
        name: accountId
        required: true
        type: integer
      - description: Why the submission was rejected
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.rejectPanReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.KYCRecord'
        "400":
          description: accountId must be an integer / reason missing or too long
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'kyc:verify' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No PAN on file for this account
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Reject an account's KYC submission (admin only)
      tags:
      - kyc
  /admin/kyc/pan/{accountId}/verify:
    post:
      description: Marks the named account's KYC row as PAN-verified and clears any
        previous rejection reason. Required before that account can request credit
        analytics. Needs the 'kyc:verify' permission.
      parameters:
      - description: Account id whose PAN is being verified
        in: path
        name: accountId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.KYCRecord'
        "400":
          description: accountId must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'kyc:verify' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No PAN on file for this account
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Verify an account's PAN (admin only)
      tags:
      - kyc
  /admin/kyc/pending:
    get:
      description: 'Returns accounts that submitted a PAN and are awaiting verification,
        ordered newest activity first (a re-submitted PAN sorts back to the top).
        The rows carry the full PAN so a reviewer can check it, which is why the endpoint
        needs the ''kyc:verify'' permission. Paged: `limit` defaults to 50 and is
        capped at 200, `offset` skips rows; `total` is the size of the whole queue,
        not of the page.'
      parameters:
      - description: Max rows to return (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Rows to skip (default 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.KYCReviewPage'
        "400":
          description: limit/offset must be integers
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'kyc:verify' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List pending KYC requests (admin only)
      tags:
      - kyc
  /admin/loan-providers:
    get:
      description: Returns configured providers, optionally filtered by loanType (HOME|PERSONAL|CAR)
        and active. Requires 'loan-provider:manage'.
      parameters:
      - description: Filter by loan type (HOME, PERSONAL, CAR)
        in: query
        name: loanType
        type: string
      - description: Filter by active flag
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_models.LoanProvider'
            type: array
        "400":
          description: Invalid loanType
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'loan-provider:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List loan providers (admin)
      tags:
      - loan-providers
    post:
      consumes:
      - application/json
      description: 'Adds what a lender is offering for a loan type (HOME, PERSONAL,
        CAR): interest rate, processing fees, minimum credit score, and optional tenure
        cap. Used by the switch optimizer. Requires the ''loan-provider:manage'' permission.'
      parameters:
      - description: Provider offering
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.providerReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.LoanProvider'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'loan-provider:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create a loan provider offering (admin)
      tags:
      - loan-providers
  /admin/loan-providers/{id}:
    delete:
      parameters:
      - description: Provider id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Loan provider deleted\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'loan-provider:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Loan provider not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Delete a loan provider (admin)
      tags:
      - loan-providers
    get:
      parameters:
      - description: Provider id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.LoanProvider'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'loan-provider:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Loan provider not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Fetch a loan provider by id (admin)
      tags:
      - loan-providers
    put:
      consumes:
      - application/json
      description: Replaces the mutable fields of a provider. Requires 'loan-provider:manage'.
      parameters:
      - description: Provider id
        in: path
        name: id
        required: true
        type: integer
      - description: Provider offering
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.providerReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.LoanProvider'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'loan-provider:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Loan provider not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update a loan provider (admin)
      tags:
      - loan-providers
  /admin/loan-switch/settings:
    get:
      description: Returns the configurable recovery window (how many months the switching
        cost must be recovered within to recommend a switch) and the default foreclosure
        fees per loan type. Requires 'loan-provider:manage'.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.LoanSwitchSettings'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'loan-provider:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get loan-switch settings (admin)
      tags:
      - loan-providers
    put:
      consumes:
      - application/json
      description: Sets the recovery window (months) and default foreclosure fees
        per loan type. Requires 'loan-provider:manage'.
      parameters:
      - description: Switch settings
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.settingsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.LoanSwitchSettings'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'loan-provider:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update loan-switch settings (admin)
      tags:
      - loan-providers
  /auth/email/send:
    post:
      consumes:
      - application/json
      description: 'Mails a one-time code to the address the signed-in account wants
        to link. Optional, unlike the mobile number: a phone signup is complete without
        one. Refuses an address already registered to another account, and refuses
        to change an address this account has already linked. Same cooldown / send
        limits as every other OTP.'
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.emailLinkSendReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Verification code sent\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Already registered / already linked / resend cooldown
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Send an OTP to link an email address
      tags:
      - auth
  /auth/email/verify:
    post:
      consumes:
      - application/json
      description: Checks the code sent by POST /auth/email/send and attaches the
        address to the signed-in account as a verified identity. Nothing is written
        until the code passes. Returns the updated profile, in the same shape as GET
        /profile. No new session is issued. The linked identity carries no password,
        so email+password login stays unavailable until one is set through the forgot-password
        flow.
      parameters:
      - description: Email + OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.emailLinkVerifyReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Profile'
        "400":
          description: Validation failed / wrong / expired / locked OTP
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Already registered to another account
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Verify and link an email address
      tags:
      - auth
  /auth/google:
    post:
      consumes:
      - application/json
      description: Verifies a Google ID token (issued by the Android/iOS Google Sign-In
        SDK) and returns a session JWT. On first login, creates a verified account;
        on subsequent logins, reuses the existing account. If the Google email matches
        an existing account, the Google identity is linked onto it. Requires the Web
        OAuth client ID to be configured (AUTH_GOOGLE_CLIENT_ID); otherwise returns
        503.
      parameters:
      - description: Stable per-device UUID
        in: header
        name: X-Device-Id
        type: string
      - description: Human-readable device name shown in the device list
        in: header
        name: X-Device-Name
        type: string
      - description: ios | android | web
        in: header
        name: X-Device-Platform
        type: string
      - description: JSON device description, e.g. {\
        in: header
        name: X-Device-Info
        type: string
      - description: Google ID token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.googleLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.AuthResult'
        "400":
          description: Validation failed (missing idToken)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Invalid Google token
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Google identity already linked to another account
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "503":
          description: Google login is not configured
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Log in with Google
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Verifies email + password and opens a session for the calling
        device. Returns a short-lived access JWT plus a refresh token — in the JSON
        body for mobile clients, or as an httpOnly `refresh_token` cookie when `X-Device-Platform:
        web`. Send `X-Device-Id` (a stable per-device UUID) so repeat logins update
        one entry in the device list instead of creating a new one.'
      parameters:
      - description: Stable per-device UUID
        in: header
        name: X-Device-Id
        type: string
      - description: Human-readable device name shown in the device list
        in: header
        name: X-Device-Name
        type: string
      - description: ios | android | web
        in: header
        name: X-Device-Platform
        type: string
      - description: JSON device description, e.g. {\
        in: header
        name: X-Device-Info
        type: string
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.AuthResult'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Invalid email or password / email not verified
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Log in with email + password
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the session the access token was issued for and clears
        the web refresh cookie. The access token itself stays valid until it expires
        (minutes), so clients should discard it too.
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Signed out\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Sign out of the current device
      tags:
      - auth
  /auth/otp/phone/send:
    post:
      consumes:
      - application/json
      description: Sends a one-time code to an Indian mobile number (bare 10 digits
        or +91-prefixed). Unknown numbers are allowed — verifying the code creates
        the account. Subject to the same cooldown / send limits as email OTPs. Delivered
        by SMS through MSG91 when an auth key is configured; without one the code
        is written to the server log instead.
      parameters:
      - description: Mobile number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.phoneOtpSendReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Verification code sent\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Resend cooldown / send limit reached
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Send a phone sign-in OTP
      tags:
      - auth
  /auth/otp/phone/verify:
    post:
      consumes:
      - application/json
      description: Checks the code sent by POST /auth/otp/phone/send and opens a session
        for the calling device. A first-time number gets an account created on the
        spot (profile incomplete); an existing number signs into its account. Returns
        the same session payload as email login.
      parameters:
      - description: Stable per-device UUID
        in: header
        name: X-Device-Id
        type: string
      - description: Human-readable device name shown in the device list
        in: header
        name: X-Device-Name
        type: string
      - description: ios | android | web
        in: header
        name: X-Device-Platform
        type: string
      - description: JSON device description
        in: header
        name: X-Device-Info
        type: string
      - description: Phone + OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.phoneOtpVerifyReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.AuthResult'
        "400":
          description: Validation failed / wrong / expired / locked OTP
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Verify a phone OTP and sign in
      tags:
      - auth
  /auth/otp/resend:
    post:
      consumes:
      - application/json
      description: Re-issues the signup OTP for an unverified email, subject to cooldown
        / send limits.
      parameters:
      - description: Email to resend to
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.resendReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Verification code re-sent\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation failed / cooldown / send limit
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No signup found for this email
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Email is already verified
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Resend signup verification OTP
      tags:
      - auth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Emails a one-time code to a verified email+password account. Returns
        the same 200 for an address with no account, so the endpoint cannot be used
        to discover which emails are registered. Call again to resend, subject to
        the same cooldown / send limits as signup.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.forgotPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"If that email has an account, a reset code
            is on its way\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Resend cooldown / send limit reached
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Start a password reset
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Redeems the single-use `resetToken` from POST /auth/password/verify-otp
        and writes the new password. Every signed-in device is then signed out, so
        the caller must log in again with the new password. The token is spent whether
        or not the caller keeps the response.
      parameters:
      - description: Email + reset token + new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.resetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Password updated. Please sign in.\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation failed (password too short/long)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Reset token is unknown, expired or already used
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Set a new password with a verified reset token
      tags:
      - auth
  /auth/password/verify-otp:
    post:
      consumes:
      - application/json
      description: Checks the code emailed by POST /auth/password/forgot and returns
        a single-use `resetToken`, which POST /auth/password/reset redeems to set
        the new password. The code is consumed here — a wrong code counts against
        the same attempt limit as signup verification.
      parameters:
      - description: Email + OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.verifyResetOtpReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.PasswordResetGrant'
        "400":
          description: Wrong / expired / locked OTP
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No account found for this email
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Verify a password-reset code
      tags:
      - auth
  /auth/phone/send:
    post:
      consumes:
      - application/json
      description: 'Sends a one-time code to the mobile number the signed-in account
        wants to register. Mandatory for email signups: PAN verification checks the
        PAN against the account''s mobile number, so an account without one cannot
        complete KYC. Refuses a number already registered to another account. Same
        cooldown / send limits as every other OTP.'
      parameters:
      - description: Mobile number
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.phoneRegisterSendReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Verification code sent\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Number already registered / resend cooldown / send limit reached
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Send an OTP to register a mobile number
      tags:
      - auth
  /auth/phone/verify:
    post:
      consumes:
      - application/json
      description: Checks the code sent by POST /auth/phone/send and attaches the
        number to the signed-in account as a verified phone identity. Returns the
        updated profile, in the same shape as GET /profile. No new session is issued
        — the access token is unaffected, so the client keeps the one it has.
      parameters:
      - description: Phone + OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.phoneRegisterVerifyReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Profile'
        "400":
          description: Validation failed / wrong / expired / locked OTP
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Number already registered to another account
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Verify and register a mobile number
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Rotates the refresh token and issues a fresh access token. Mobile
        clients send the token in the JSON body; web clients send nothing — the httpOnly
        `refresh_token` cookie is read automatically. The old refresh token is invalidated
        on every call, so replaying one revokes the whole session as a theft signal.
        Public endpoint: the refresh token itself is the credential.'
      parameters:
      - description: Stable per-device UUID
        in: header
        name: X-Device-Id
        type: string
      - description: ios | android | web
        in: header
        name: X-Device-Platform
        type: string
      - description: JSON device description, e.g. {\
        in: header
        name: X-Device-Info
        type: string
      - description: Refresh token (omit for web cookie clients)
        in: body
        name: request
        schema:
          $ref: '#/definitions/internal_handler.refreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.AuthResult'
        "401":
          description: Missing, expired, replayed, or unknown refresh token
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Exchange a refresh token for a new token pair
      tags:
      - auth
  /auth/sessions:
    delete:
      description: Revokes all of the account's sessions except the caller's own.
        Use after a password change or when a device is lost.
      produces:
      - application/json
      responses:
        "200":
          description: '{\"revoked\": 3}'
          schema:
            additionalProperties:
              type: integer
            type: object
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Sign out every other device
      tags:
      - auth
    get:
      description: 'Returns the account''s active sessions, most recently used first.
        The entry matching the caller''s own access token is flagged with `current:
        true`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_service.SessionView'
            type: array
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List signed-in devices
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Revokes a single session by id. Only the caller's own sessions
        are reachable — an id belonging to another account returns 404, not 403, so
        session ids cannot be probed.
      parameters:
      - description: Session id from GET /auth/sessions
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Device signed out\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No such active session
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Sign out one device
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a PENDING account with an unverified password identity
        and emails a verification OTP. Re-signing up for an unverified email updates
        the password and re-issues the OTP.
      parameters:
      - description: Signup credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.signupReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.SignupResult'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Sign up with email + password
      tags:
      - auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      description: Checks the signup OTP; on success verifies the identity, activates
        the account, and opens a session for the calling device. Token delivery follows
        the same rules as POST /auth/login.
      parameters:
      - description: Stable per-device UUID
        in: header
        name: X-Device-Id
        type: string
      - description: Human-readable device name shown in the device list
        in: header
        name: X-Device-Name
        type: string
      - description: ios | android | web
        in: header
        name: X-Device-Platform
        type: string
      - description: JSON device description, e.g. {\
        in: header
        name: X-Device-Info
        type: string
      - description: Email + OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.verifyEmailReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.AuthResult'
        "400":
          description: Wrong / expired / locked OTP
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Verify email with OTP
      tags:
      - auth
  /bank-statements:
    get:
      description: Returns a paginated list of the caller's uploads, newest first.
        Each item carries the id, filename, status, transaction count, and period
        — not the full analysis (fetch by id for that).
      parameters:
      - default: 1
        description: 1-indexed page number (default 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: page size (default 20, max 100)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.StatementPage'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List the authenticated account's bank-statement analyses
      tags:
      - bank-statements
  /bank-statements/{id}:
    get:
      description: Returns the analysis for one of the caller's own uploads. When
        status is 'processing', analysis is null; when 'completed', analysis carries
        the derived metrics (summary, salary, emis, subscriptions, categories, topMerchants,
        monthlyTotals, transactions); when 'failed', errorMessage explains why.
      parameters:
      - description: Statement id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.BankStatement'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Statement not found (or belongs to another account)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Fetch a bank-statement analysis by id
      tags:
      - bank-statements
  /bank-statements/{id}/raw:
    get:
      description: Returns one of the caller's own uploads including the extractedText
        (the PDF text layer exactly as parsed). Useful for debugging "why wasn't my
        salary detected" — the analysis is computed from this text. Never includes
        the raw PDF bytes.
      parameters:
      - description: Statement id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.BankStatement'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Statement not found (or belongs to another account)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Fetch the raw extracted text for a bank statement
      tags:
      - bank-statements
  /bank-statements/analyze:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a single PDF under the multipart field "file", persists
        it in 'processing' status, and queues asynchronous analysis. Returns the created
        row immediately with status 202; poll /bank-statements/{id} until status is
        'completed' (analysis populated) or 'failed' (errorMessage set).
      parameters:
      - description: Bank statement PDF (text layer required; scanned PDFs are not
          supported yet)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.BankStatement'
        "400":
          description: No file uploaded / not a PDF / empty file
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "413":
          description: File exceeds the maximum allowed size
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "503":
          description: Analysis queue is full; retry shortly
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Upload a bank-statement PDF for analysis
      tags:
      - bank-statements
  /bank-statements/digitap/callback:
    post:
      consumes:
      - application/json
      description: 'Public server-to-server endpoint called by Digitap once the user
        finishes (or cancels) the statement upload on its UI. Not for client use:
        there is no bearer auth — trust comes from the x-digitap-callback-type header
        and, when configured, a ?secret= shared-secret query param (the API defines
        no HMAC in v1.20). Always returns 200 quickly; the report fetch happens after
        the response.'
      parameters:
      - description: TRANSACTION_COMPLETE
        in: header
        name: x-digitap-callback-type
        required: true
        type: string
      - description: Shared secret, when callback-secret is configured
        in: query
        name: secret
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{""ok"":true}'
          schema:
            type: object
      summary: Digitap transaction-complete webhook
      tags:
      - bank-statements
  /bank-statements/digitap/initiate:
    post:
      consumes:
      - application/json
      description: Calls Digitap's Generate URL API and returns a redirect URL the
        client should send the user to. The user uploads their statement PDF on Digitap's
        UI (it never touches this service). Digitap calls our callback on completion;
        the client polls GET /bank-statements/{id} until status is 'completed' or
        'failed'. Available regardless of statement.provider — the client chooses
        between this and the local upload (POST /analyze).
      parameters:
      - description: '{ '
        in: body
        name: request
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.DigitapInitiateResponse'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "502":
          description: Digitap rejected the request
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "503":
          description: Digitap flow not configured
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Start a Digitap bank-statement analysis (redirect flow)
      tags:
      - bank-statements
  /bank-statements/latest:
    get:
      description: Returns the most recent 'completed' analysis for the caller, with
        the full derived metrics. Returns 404 if no analysis has completed yet.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.BankStatement'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No completed bank statement analysis found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get the latest completed bank-statement analysis
      tags:
      - bank-statements
  /coupons:
    get:
      description: Returns the coupons the caller issued, newest first. Holders of
        'coupon:admin' (admins) see every coupon instead.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_models.Coupon'
            type: array
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'coupon:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List coupons
      tags:
      - coupons
    post:
      consumes:
      - application/json
      description: Creates a percentage-discount coupon owned by the calling account.
        Requires the 'coupon:create' permission, held by agents and admins. Omit productCode
        to have it apply to every product; omit maxRedemptions for unlimited use.
        The discount is applied server-side at checkout — clients never send prices.
      parameters:
      - description: Coupon definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createCouponReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Coupon'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'coupon:create' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: That coupon code is already taken
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Issue a coupon code
      tags:
      - coupons
  /coupons/{code}:
    delete:
      description: Stops future use of a coupon. Agents may only revoke their own;
        a code belonging to someone else reads as 404 so the endpoint cannot be used
        to discover which codes exist. Orders already placed keep their discount —
        revoking is not retroactive.
      parameters:
      - description: Coupon code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Coupon revoked\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Malformed code
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'coupon:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No such active coupon
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Revoke a coupon
      tags:
      - coupons
  /coupons/quote:
    get:
      description: What the payment screen calls when a customer enters a code. Returns
        the list price, the discount, and the payable total, all computed server-side.
        Reserves nothing — the coupon is only consumed when the order is created,
        so a quote can go stale if the last redemption is taken in between. Any authenticated
        user may call it.
      parameters:
      - description: Coupon code
        in: query
        name: code
        required: true
        type: string
      - description: Product being purchased
        in: query
        name: productCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.Quote'
        "400":
          description: Invalid coupon or unknown product
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Price a product with a coupon applied
      tags:
      - coupons
  /coupons/referral:
    get:
      description: 'Returns the caller''s permanent referral code, creating it on
        the first call. Anyone new who signs up with this code is attributed to the
        caller — mainly how agents recruit users. Referral codes carry no discount,
        never expire, and can be used any number of times; each account has exactly
        one. Safe to call repeatedly: after the first call it is a plain lookup.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Coupon'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Could not allocate a code; retry
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get your referral code
      tags:
      - coupons
  /credit-analytics/latest-insights:
    get:
      description: 'Returns derived analytics from the most recent successful credit
        report: the bureau score, on-time payment %, card utilization %, 180-day enquiries,
        the graded report card, per-loan interest-reduction (balance-transfer) opportunities
        under interestSavings, and a single prioritized ''recommendations'' list spanning
        both levers — raising the score and cutting interest. Also includes a scoreBuilder
        block (journey classification, realistic target, positives, weak-factor diagnosis,
        and a rebuild/protect toolkit).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.ReportInsights'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No credit report found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get credit insights from the latest report
      tags:
      - credit-analytics
  /credit-analytics/reports:
    get:
      description: Returns a paginated list of the caller's reports, newest first.
        Each item carries only the report id (unique identifier) and generation date.
      parameters:
      - default: 1
        description: 1-indexed page number (default 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: page size (default 20, max 100)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.ReportPage'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List the authenticated account's credit-analytics reports
      tags:
      - credit-analytics
  /credit-analytics/reports/{id}:
    get:
      description: Returns the derived analytics (bureau score, on-time payment %,
        card utilization %, 180-day enquiry count, account summary, loan accounts,
        report card, interest-reduction opportunities under interestSavings, and a
        unified 'recommendations' list, plus a scoreBuilder diagnosis+toolkit) for
        one of the caller's own reports, computed from the stored bureau response.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.ReportInsights'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Report not found (or belongs to another account)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Fetch a credit-analytics report by id
      tags:
      - credit-analytics
  /credit-analytics/reports/{id}/email:
    post:
      description: Sends the caller's own report PDF, encrypted, to the email address
        on their account. Returns 409 when the account has no email — a phone signup
        that never linked one — so the client can offer to link an address rather
        than reporting a dead end.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ReportEmailResponse'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Report not found, or no PDF stored for it
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: No email address on the account — link one first
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "502":
          description: Could not send the email
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "503":
          description: Report storage or email delivery is not configured
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Email a report's PDF to the account's address
      tags:
      - credit-analytics
  /credit-analytics/reports/{id}/pdf:
    get:
      description: Returns a short-lived presigned URL for the caller's own report
        PDF, plus the rule for the password that opens it. The PDF is encrypted with
        the account holder's PAN and date of birth, so the link alone does not expose
        the report. A 404 means the report has no PDF yet — the relay that fetches
        it from the bureau is asynchronous and best-effort.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ReportPDFLinkResponse'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Report not found, or no PDF stored for it
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "502":
          description: Could not prepare the download
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "503":
          description: Report storage is not configured
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get a download link for a report's PDF
      tags:
      - credit-analytics
  /credit-analytics/reports/{id}/raw:
    get:
      description: Returns the full report row for one of the caller's own reports,
        including the persisted raw Digitap response body (response_body) exactly
        as received upstream. Use /reports/{id} for the derived analytics instead.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.CreditAnalyticsRequest'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Report not found (or belongs to another account)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Fetch the raw Digitap response for a report by id
      tags:
      - credit-analytics
  /credit-analytics/request:
    post:
      consumes:
      - application/json
      description: Builds the Digitap /credit_analytics/request payload from the authenticated
        account's profile and KYC record (mobile, name, PAN), plus server-generated
        values (client_ref_num, otp, timestamp), then persists the request and full
        upstream response and returns the derived analytics (insights) computed from
        that response — bureau score, on-time payment %, card utilization %, enquiry
        count, account summary, report card, interest-reduction opportunities, recommendations,
        and a score-builder block. Only device_ip is taken from the request body;
        if omitted it falls back to the detected remote IP. Use /reports/{id}/raw
        to fetch the unprocessed Digitap response.
      parameters:
      - description: Credit-analytics request (device_ip optional; defaults to the
          caller's IP)
        in: body
        name: request
        schema:
          $ref: '#/definitions/credit-report-service_internal_service.CreditAnalyticsInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.ReportInsights'
        "400":
          description: Invalid request body / missing profile or PAN / upstream 400
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "422":
          description: Upstream tradeline limit exceeded
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "502":
          description: Digitap unreachable, or returned an unhandled error
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "503":
          description: Digitap rejected our client credentials (server misconfiguration)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Request a credit analysis from Digitap
      tags:
      - credit-analytics
  /credit-analytics/score-simulator:
    get:
      description: Projects the caller's credit score under a chosen set of actions.
        Builds a toggle-action set from the report's actual signals (positive levers
        the file has room to improve on, plus two universal negative actions), and
        sums the selected deltas onto the current score. By default every positive
        action is selected; pass `actions` (a comma-separated list of action keys)
        to override the selection. By default it uses the caller's most recent report;
        pass reportId to simulate against a specific one (must be your own). Deltas
        are estimates from your file, not guarantees.
      parameters:
      - description: Simulate against this report instead of the latest (must be your
          own)
        in: query
        name: reportId
        type: integer
      - description: 'Comma-separated action keys to select (default: all positive
          actions)'
        in: query
        name: actions
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.Simulation'
        "400":
          description: reportId must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No credit report found / report not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Score what-if simulator
      tags:
      - score-builder
  /kyc/pan:
    post:
      consumes:
      - application/json
      description: Accepts a PAN and the full name printed on it, then verifies both
        against the mobile number registered on the account, using Digitap's Mobile
        to Prefill API. A match returns a VERIFIED record. A mismatch returns 422
        and counts against a retry cap. If the provider holds no record for the number,
        the PAN is stored PENDING and 201 is returned — the user is not blocked for
        a gap in someone else's data. A re-submission overwrites any existing PAN
        and resets verification.
      parameters:
      - description: PAN and full name as printed on the card
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.submitPanReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.KYCRecord'
        "400":
          description: Invalid JSON body / PAN format
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: PAN already linked to another account
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "422":
          description: PAN or name does not match the mobile number, or retries exhausted
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Submit and verify the authenticated account's PAN
      tags:
      - kyc
  /kyc/status:
    get:
      description: 'Returns the account''s KYC state without exposing the full PAN
        (only the last 4 digits). An account that has never submitted a PAN gets 200
        with status NOT_SUBMITTED — "no record" is a state, not an error — so a client
        can render the onboarding step directly from `status`. Possible values: NOT_SUBMITTED,
        PENDING, VERIFIED, REJECTED.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.KYCStatus'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get the authenticated account's KYC status
      tags:
      - kyc
  /loan-switch/opportunities:
    get:
      description: Matches each active home/personal/car loan on a credit report to
        the cheapest configured provider for the caller's score band, and estimates
        the monthly and total savings of a balance transfer. By default it uses the
        caller's most recent report; pass reportId to evaluate a specific one (must
        be your own). A switch is 'recommended' only when its cost (current loan's
        foreclosure fee + new provider's processing fee) is recovered within the configured
        recovery window. Loans the report is too sparse to evaluate are returned with
        status 'insufficient_data'. Rates are indicative benchmarks, not offers.
      parameters:
      - description: Evaluate this report instead of the latest (must be your own)
        in: query
        name: reportId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.SwitchOpportunities'
        "400":
          description: reportId must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No credit report found / report not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Loan-switch savings opportunities from a credit report
      tags:
      - loan-switch
  /orders:
    get:
      description: Returns every order placed by the authenticated account, newest
        first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_models.Order'
            type: array
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List the authenticated account's orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Creates an order for the given product against the authenticated
        account and registers it with Cashfree. The response carries `paymentSessionId`
        and `mode`, which the frontend passes to the Cashfree JS SDK to open checkout.
      parameters:
      - description: Product to purchase
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createOrderReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.PurchaseResult'
        "400":
          description: Invalid JSON body / productCode missing or unknown
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Product is not available for purchase
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "502":
          description: Payment gateway could not create the order
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create an order and start checkout
      tags:
      - orders
  /orders/{orderId}:
    get:
      description: Returns a single order owned by the authenticated account. If the
        order is still awaiting payment its status is reconciled against Cashfree
        before being returned, so this is the endpoint to poll after checkout closes.
      parameters:
      - description: Order id returned from order creation
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Order'
        "400":
          description: orderId is not valid
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get one order
      tags:
      - orders
  /payments/cashfree/webhook:
    post:
      consumes:
      - application/json
      description: 'Server-to-server endpoint called by Cashfree on payment success/failure.
        Not for client use: there is no bearer auth, trust comes from the `x-webhook-signature`
        HMAC over the raw body, and `x-idempotency-key` de-duplicates redeliveries.'
      parameters:
      - description: Cashfree signature timestamp
        in: header
        name: x-webhook-timestamp
        required: true
        type: string
      - description: Base64 HMAC-SHA256 of timestamp+body
        in: header
        name: x-webhook-signature
        required: true
        type: string
      - description: Cashfree delivery id, used to drop duplicates
        in: header
        name: x-idempotency-key
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Invalid webhook payload
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Invalid webhook signature
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Cashfree payment webhook
      tags:
      - payments
  /ping:
    get:
      description: Reports whether the service is up.
      produces:
      - application/json
      responses:
        "200":
          description: UP
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - health
  /products:
    get:
      description: Returns the active product catalog with prices. Use a product's
        `code` as the `productCode` when creating an order.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_models.Product'
            type: array
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List purchasable products
      tags:
      - orders
  /profile:
    get:
      description: Returns the full account record for the current session, plus a
        "kyc" block carrying the account's KYC state (status, panVerified, last 4
        of the PAN). Clients should read KYC completion from here rather than tracking
        it locally.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Profile'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get the authenticated account's profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      description: Sets first/last name (required) and optional date of birth (YYYY-MM-DD),
        marking the profile step complete.
      parameters:
      - description: Profile fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateProfileReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Profile'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update the authenticated account's profile
      tags:
      - profile
securityDefinitions:
  BearerAuth:
    description: '"Bearer <jwt>" — obtain via POST /api/auth/login or /api/auth/verify-email'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
