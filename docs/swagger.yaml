      summary: List signed-in devices
      tags:
      - auth
  /auth/sessions/{id}:
    delete:
      description: Revokes a single session by id. Only the caller's own sessions
        are reachable — an id belonging to another account returns 404, not 403, so
        session ids cannot be probed.
      parameters:
      - description: Session id from GET /auth/sessions
        in: path
