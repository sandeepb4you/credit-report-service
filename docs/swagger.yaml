          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.AuthResult'
        "400":
          description: Wrong / expired / locked OTP
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Verify email with OTP
      tags:
      - auth
  /coupons:
    get:
      description: Returns the coupons the caller issued, newest first. Holders of
        'coupon:admin' (admins) see every coupon instead.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_models.Coupon'
            type: array
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'coupon:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List coupons
      tags:
      - coupons
    post:
      consumes:
      - application/json
      description: Creates a percentage-discount coupon owned by the calling account.
        Requires the 'coupon:create' permission, held by agents and admins. Omit productCode
        to have it apply to every product; omit maxRedemptions for unlimited use.
        The discount is applied server-side at checkout — clients never send prices.
      parameters:
      - description: Coupon definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createCouponReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Coupon'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'coupon:create' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: That coupon code is already taken
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Issue a coupon code
      tags:
      - coupons
  /coupons/{code}:
    delete:
      description: Stops future use of a coupon. Agents may only revoke their own;
        a code belonging to someone else reads as 404 so the endpoint cannot be used
        to discover which codes exist. Orders already placed keep their discount —
        revoking is not retroactive.
      parameters:
      - description: Coupon code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{\"message\": \"Coupon revoked\"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Malformed code
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'coupon:manage' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No such active coupon
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Revoke a coupon
      tags:
      - coupons
  /coupons/quote:
    get:
      description: What the payment screen calls when a customer enters a code. Returns
        the list price, the discount, and the payable total, all computed server-side.
        Reserves nothing — the coupon is only consumed when the order is created,
        so a quote can go stale if the last redemption is taken in between. Any authenticated
        user may call it.
      parameters:
      - description: Coupon code
        in: query
        name: code
        required: true
        type: string
      - description: Product being purchased
        in: query
        name: productCode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.Quote'
        "400":
          description: Invalid coupon or unknown product
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Price a product with a coupon applied
      tags:
      - coupons
  /coupons/referral:
    get:
      description: 'Returns the caller''s permanent referral code, creating it on
        the first call. Anyone new who signs up with this code is attributed to the
        caller — mainly how agents recruit users. Referral codes carry no discount,
        never expire, and can be used any number of times; each account has exactly
        one. Safe to call repeatedly: after the first call it is a plain lookup.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Coupon'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Could not allocate a code; retry
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get your referral code
      tags:
      - coupons
  /credit-analytics/latest-insights:
    get:
      description: 'Returns derived analytics from the most recent successful credit
        report: the bureau score, on-time payment %, card utilization %, 180-day enquiries,
        the graded report card, per-loan interest-reduction (balance-transfer) opportunities
        under interestSavings, and a single prioritized ''recommendations'' list spanning
        both levers — raising the score and cutting interest. Also includes a scoreBuilder
        block (journey classification, realistic target, positives, weak-factor diagnosis,
        and a rebuild/protect toolkit).'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.ReportInsights'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No credit report found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get credit insights from the latest report
      tags:
      - credit-analytics
  /credit-analytics/reports:
    get:
      description: Returns a paginated list of the caller's reports, newest first.
        Each item carries only the report id (unique identifier) and generation date.
      parameters:
      - default: 1
        description: 1-indexed page number (default 1)
        in: query
        name: page
        type: integer
      - default: 20
        description: page size (default 20, max 100)
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.ReportPage'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List the authenticated account's credit-analytics reports
      tags:
      - credit-analytics
  /credit-analytics/reports/{id}:
    get:
      description: Returns the derived analytics (bureau score, on-time payment %,
        card utilization %, 180-day enquiry count, account summary, loan accounts,
        report card, interest-reduction opportunities under interestSavings, and a
        unified 'recommendations' list, plus a scoreBuilder diagnosis+toolkit) for
        one of the caller's own reports, computed from the stored bureau response.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.ReportInsights'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Report not found (or belongs to another account)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Fetch a credit-analytics report by id
      tags:
      - credit-analytics
  /credit-analytics/reports/{id}/raw:
    get:
      description: Returns the full report row for one of the caller's own reports,
        including the persisted raw Digitap response body (response_body) exactly
        as received upstream. Use /reports/{id} for the derived analytics instead.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.CreditAnalyticsRequest'
        "400":
          description: id must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Report not found (or belongs to another account)
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Fetch the raw Digitap response for a report by id
      tags:
      - credit-analytics
  /credit-analytics/request:
    post:
      consumes:
      - application/json
      description: Builds the Digitap /credit_analytics/request payload from the authenticated
        account's profile and KYC record (mobile, name, PAN), plus server-generated
        values (client_ref_num, otp, timestamp), then persists the request and full
        upstream response and returns the stored row. Only device_ip is taken from
        the request body; if omitted it falls back to the detected remote IP.
      parameters:
      - description: Credit-analytics request (device_ip optional; defaults to the
          caller's IP)
        in: body
        name: request
        schema:
          $ref: '#/definitions/credit-report-service_internal_service.CreditAnalyticsInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.CreditAnalyticsRequest'
        "400":
          description: Invalid request body / missing profile or PAN / upstream 400
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated / upstream 401
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "422":
          description: Upstream tradeline limit exceeded
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Request a credit analysis from Digitap
      tags:
      - credit-analytics
  /credit-analytics/score-simulator:
    get:
      description: Projects the caller's credit score under a chosen set of actions.
        Builds a toggle-action set from the report's actual signals (positive levers
        the file has room to improve on, plus two universal negative actions), and
        sums the selected deltas onto the current score. By default every positive
        action is selected; pass `actions` (a comma-separated list of action keys)
        to override the selection. By default it uses the caller's most recent report;
        pass reportId to simulate against a specific one (must be your own). Deltas
        are estimates from your file, not guarantees.
      parameters:
      - description: Simulate against this report instead of the latest (must be your
          own)
        in: query
        name: reportId
        type: integer
      - description: 'Comma-separated action keys to select (default: all positive
          actions)'
        in: query
        name: actions
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.Simulation'
        "400":
          description: reportId must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No credit report found / report not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Score what-if simulator
      tags:
      - score-builder
  /kyc/pan:
    post:
      consumes:
      - application/json
      description: Accepts a PAN (Permanent Account Number), validates the format,
        and upserts it against the account's KYC record. A re-submission overwrites
        any existing PAN and resets verification to PENDING.
      parameters:
      - description: PAN to store
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.submitPanReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.KYCRecord'
        "400":
          description: Invalid JSON body / PAN format
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: PAN already linked to another account
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Submit the authenticated account's PAN
      tags:
      - kyc
  /loan-switch/opportunities:
    get:
      description: Matches each active home/personal/car loan on a credit report to
        the cheapest configured provider for the caller's score band, and estimates
        the monthly and total savings of a balance transfer. By default it uses the
        caller's most recent report; pass reportId to evaluate a specific one (must
        be your own). A switch is 'recommended' only when its cost (current loan's
        foreclosure fee + new provider's processing fee) is recovered within the configured
        recovery window. Loans the report is too sparse to evaluate are returned with
        status 'insufficient_data'. Rates are indicative benchmarks, not offers.
      parameters:
      - description: Evaluate this report instead of the latest (must be your own)
        in: query
        name: reportId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.SwitchOpportunities'
        "400":
          description: reportId must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: No credit report found / report not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Loan-switch savings opportunities from a credit report
      tags:
      - loan-switch
  /orders:
    get:
      description: Returns every order placed by the authenticated account, newest
        first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_models.Order'
            type: array
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List the authenticated account's orders
      tags:
      - orders
    post:
      consumes:
      - application/json
      description: Creates an order for the given product against the authenticated
        account and registers it with Cashfree. The response carries `paymentSessionId`
        and `mode`, which the frontend passes to the Cashfree JS SDK to open checkout.
      parameters:
      - description: Product to purchase
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.createOrderReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/credit-report-service_internal_service.PurchaseResult'
        "400":
          description: Invalid JSON body / productCode missing or unknown
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "409":
          description: Product is not available for purchase
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "502":
          description: Payment gateway could not create the order
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Create an order and start checkout
      tags:
      - orders
  /orders/{orderId}:
    get:
      description: Returns a single order owned by the authenticated account. If the
        order is still awaiting payment its status is reconciled against Cashfree
        before being returned, so this is the endpoint to poll after checkout closes.
      parameters:
      - description: Order id returned from order creation
        in: path
        name: orderId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Order'
        "400":
          description: orderId is not valid
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Order not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get one order
      tags:
      - orders
  /payments/cashfree/webhook:
    post:
      consumes:
      - application/json
      description: 'Server-to-server endpoint called by Cashfree on payment success/failure.
        Not for client use: there is no bearer auth, trust comes from the `x-webhook-signature`
        HMAC over the raw body, and `x-idempotency-key` de-duplicates redeliveries.'
      parameters:
      - description: Cashfree signature timestamp
        in: header
        name: x-webhook-timestamp
        required: true
        type: string
      - description: Base64 HMAC-SHA256 of timestamp+body
        in: header
        name: x-webhook-signature
        required: true
        type: string
      - description: Cashfree delivery id, used to drop duplicates
        in: header
        name: x-idempotency-key
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Invalid webhook payload
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Invalid webhook signature
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      summary: Cashfree payment webhook
      tags:
      - payments
  /ping:
    get:
      description: Reports whether the service is up.
      produces:
      - application/json
      responses:
        "200":
          description: UP
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Liveness check
      tags:
      - health
  /products:
    get:
      description: Returns the active product catalog with prices. Use a product's
        `code` as the `productCode` when creating an order.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/credit-report-service_internal_models.Product'
            type: array
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: List purchasable products
      tags:
      - orders
  /profile:
    get:
      description: Returns the full account record for the current session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Account'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get the authenticated account's profile
      tags:
      - profile
    put:
      consumes:
      - application/json
      description: Sets first/last name (required) and optional date of birth (YYYY-MM-DD),
        marking the profile step complete.
      parameters:
      - description: Profile fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.updateProfileReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Account'
        "400":
          description: Validation failed
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Update the authenticated account's profile
      tags:
      - profile
securityDefinitions:
  BearerAuth:
    description: '"Bearer <jwt>" — obtain via POST /api/auth/login or /api/auth/verify-email'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
