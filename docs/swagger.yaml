basePath: /api
definitions:
  credit-report-service_internal_apperr.ErrorBody:
    properties:
      details: {}
      error:
        type: string
      message:
        type: string
      status:
        type: integer
      timestamp:
        type: string
    type: object
  credit-report-service_internal_models.Account:
    properties:
      createdAt:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: integer
      lastName:
        type: string
      phone:
        type: string
      profileCompleted:
        type: boolean
      referredAt:
        type: string
      referredByAccountId:
        description: Referral attribution, set once at signup and never changed.
        type: integer
      referredByCode:
        type: string
      role:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.AgentMeta:
    properties:
      browser:
        type: string
      browserVersion:
        type: string
      deviceType:
        description: mobile | tablet | desktop
        type: string
      os:
        type: string
      osVersion:
        type: string
    type: object
  credit-report-service_internal_models.BankOffering:
    properties:
      active:
        type: boolean
      applyUrl:
        description: ApplyURL is the CTA destination for taking up the product.
        type: string
      createdAt:
        type: string
      estimatedPointsMax:
        type: integer
      estimatedPointsMin:
        description: |-
          EstimatedPointsMin/Max bound the estimated score gain. Always rendered with
          the "estimated, not guaranteed" disclaimer.
        type: integer
      id:
        type: integer
      interestRatePercent:
        description: |-
          InterestRatePercent is the FD yield for display (the deposit keeps earning
          while the card builds history). Not a borrowing rate.
        type: number
      maxCreditScore:
        type: integer
      minCreditScore:
        description: |-
          ScoreBand gates the offering: it is surfaced only when the user's score is
          within [MinCreditScore, MaxCreditScore]. Defaults 0..900 = "everyone".
        type: integer
      minFdAmount:
        description: |-
          MinFDAmount is the fixed deposit the user opens to obtain the product
          (e.g. a card against the FD). 0 when not applicable.
        type: number
      name:
        type: string
      productType:
        type: string
      revenueNote:
        description: RevenueNote is an ops-facing referral/commission note.
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.Coupon:
    properties:
      code:
        type: string
      createdAt:
        type: string
      createdBy:
        description: CreatedBy is the issuing account — the agent this redemption
          attributes to.
        type: integer
      discountPercent:
        type: number
      id:
        type: integer
      kind:
        type: string
      maxRedemptions:
        type: integer
      perAccountLimit:
        type: integer
      productCode:
        description: ProductCode nil means the coupon applies to every product.
        type: string
      redemptionCount:
        type: integer
      revokedAt:
        type: string
      updatedAt:
        type: string
      validFrom:
        type: string
      validUntil:
        type: string
    type: object
  credit-report-service_internal_models.CreditAnalyticsRequest:
    properties:
      accountId:
        type: integer
      clientRefNum:
        type: string
      createdAt:
        type: string
      creditScore:
        description: |-
          CreditScore is the bureau score (SCORE.BureauScore) lifted out of the
          response at write time. Nil when the pull failed or returned no record.
        type: integer
      httpStatus:
        type: integer
      id:
        type: integer
      message:
        type: string
      mobileNo:
        type: string
      requestBody:
        items:
          type: integer
        type: array
      requestId:
        type: string
      responseBody:
        items:
          type: integer
        type: array
      resultCode:
        type: integer
    type: object
  credit-report-service_internal_models.DeviceMeta:
    properties:
      agent:
        allOf:
        - $ref: '#/definitions/credit-report-service_internal_models.AgentMeta'
        description: |-
          Agent is parsed by the server from the User-Agent header. Best-effort:
          unrecognized agents leave fields empty rather than guessing.
      client:
        additionalProperties:
          type: string
        description: |-
          Client is whatever the app declared via X-Device-Info: make, model, OS
          version, app version, and any extra keys it cares to send. Free-form but
          bounded (see middleware.parseDeviceInfoHeader) because it is user input.
        type: object
    type: object
  credit-report-service_internal_models.KYCRecord:
    properties:
      aadhaarLast4:
        type: string
      aadhaarPanLinked:
        type: boolean
      aadhaarReference:
        type: string
      accountId:
        type: integer
      createdAt:
        type: string
      id:
        type: integer
      pan:
        type: string
      panName:
        type: string
      panVerified:
        type: boolean
      provider:
        type: string
      status:
        type: string
      updatedAt:
        type: string
      verifiedAt:
        type: string
    type: object
  credit-report-service_internal_models.LoanProvider:
    properties:
      active:
        type: boolean
      createdAt:
        type: string
      id:
        type: integer
      interestRatePercent:
        type: number
      loanType:
        type: string
      maxTenureMonths:
        type: integer
      minCreditScore:
        type: integer
      name:
        type: string
      processingFeeFlat:
        type: number
      processingFeePercent:
        type: number
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.LoanSwitchSettings:
    properties:
      foreclosureFeePercentCar:
        type: number
      foreclosureFeePercentHome:
        type: number
      foreclosureFeePercentPersonal:
        type: number
      recoveryWindowMonths:
        type: integer
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.Order:
    properties:
      amount:
        description: |-
          Amount is what the customer is charged, i.e. already net of any coupon.
          DiscountAmount and CouponCode are snapshots of how it got there, so the
          list price is Amount + DiscountAmount and later edits to the coupon can
          never rewrite this order.
        type: number
      cfOrderId:
        type: string
      couponCode:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      discountAmount:
        type: number
      failureReason:
        type: string
      orderId:
        type: string
      paidAt:
        type: string
      paymentMethod:
        type: string
      paymentSessionId:
        type: string
      productCode:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_models.Product:
    properties:
      active:
        type: boolean
      amount:
        type: number
      code:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  credit-report-service_internal_service.AuthResult:
    properties:
      account:
        $ref: '#/definitions/credit-report-service_internal_models.Account'
      expiresAt:
        type: string
      refreshToken:
        type: string
      token:
        type: string
    type: object
  credit-report-service_internal_service.BuilderStrategy:
    properties:
      applyUrl:
        description: Product-only fields (Kind == "product"). Zero/empty otherwise.
        type: string
      detail:
        type: string
      estimatedPointsMax:
        type: integer
      estimatedPointsMin:
        type: integer
      fdAmount:
        type: number
      key:
        type: string
      kind:
        type: string
      revenueNote:
        type: string
      tag:
        type: string
      title:
        type: string
    type: object
  credit-report-service_internal_service.CardFactor:
    properties:
      detail:
        description: suggested next action
        type: string
      grade:
        description: '"A+", "A", "B", "C", "D", "F"'
        type: string
      missedCount:
        description: missed/delayed months (payment factor)
        type: integer
      name:
        description: e.g. "Payment history"
        type: string
      summary:
        description: human-readable detail line
        type: string
      weight:
        description: percent weight (e.g. 35)
        type: integer
    type: object
  credit-report-service_internal_service.CreditAnalyticsInput:
    properties:
      device_ip:
        type: string
    type: object
  credit-report-service_internal_service.LoanAccount:
    properties:
      accountNumber:
        type: string
      company:
        type: string
      currentBalance:
        type: number
      interestRatePercent:
        type: number
      loanType:
        type: string
      originalLoanAmount:
        type: number
      paymentHistory:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.PaymentMonth'
        type: array
      percentagePaid:
        type: number
      remainingTenureMonths:
        type: integer
      totalTenureMonths:
        type: integer
    type: object
  credit-report-service_internal_service.PaymentMonth:
    properties:
      daysLate:
        description: 0 if paid on time
        type: integer
      month:
        description: e.g. "2026-08"
        type: string
      status:
        description: '"paid", "delayed", "not_reported"'
        type: string
    type: object
  credit-report-service_internal_service.PurchaseResult:
    properties:
      amount:
        description: |-
          Amount is the charged total, already net of any coupon. OriginalAmount
          and DiscountAmount let the payment screen show the saving without
          recomputing it — and without being trusted to.
        type: number
      cfOrderId:
        type: string
      couponCode:
        type: string
      currency:
        type: string
      discountAmount:
        type: number
      mode:
        type: string
      orderId:
        type: string
      originalAmount:
        type: number
      paymentSessionId:
        type: string
      status:
        type: string
    type: object
  credit-report-service_internal_service.Quote:
    properties:
      code:
        type: string
      currency:
        type: string
      discountAmount:
        type: number
      discountPercent:
        type: number
      originalAmount:
        type: number
      payableAmount:
        type: number
      productCode:
        type: string
    type: object
  credit-report-service_internal_service.Recommendation:
    properties:
      category:
        description: Category is "score" (raise the credit score) or "interest" (cut
          interest).
        type: string
      detail:
        type: string
      estimatedPointsMax:
        type: integer
      estimatedPointsMin:
        description: |-
          EstimatedPointsMin/Max bound the estimated score gain for "score"
          recommendations (nil for "interest" ones). They are estimates, not
          promises — actual movement depends on lender reporting cycles.
        type: integer
      impact:
        description: |-
          Impact is a human-readable, deliberately non-promissory hint at the payoff
          (e.g. the current factor state, or the estimated rupee saving).
        type: string
      priority:
        type: integer
      title:
        type: string
    type: object
  credit-report-service_internal_service.ReportCard:
    properties:
      factors:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.CardFactor'
        type: array
      overallGrade:
        type: string
    type: object
  credit-report-service_internal_service.ReportInsights:
    properties:
      activeAccountCount:
        type: integer
      cardUtilizationPercent:
        type: number
      creditScore:
        type: integer
      derogatoryAccounts:
        description: |-
          DerogatoryAccounts counts written-off / settled / defaulted tradelines —
          the serious negatives the "good news" diagnosis checks for.
        type: integer
      enquiryCount180Days:
        type: integer
      interestPaidPerYear:
        type: number
      interestSavings:
        allOf:
        - $ref: '#/definitions/credit-report-service_internal_service.SwitchOpportunities'
        description: |-
          InterestSavings holds the balance-transfer opportunities computed from the
          report's active loans (nil when the loan-switch feature isn't wired in).
      loanAccounts:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.LoanAccount'
        type: array
      monthlyEmi:
        type: number
      onTimePaymentPercent:
        type: number
      outdated:
        type: boolean
      recommendations:
        description: |-
          Recommendations is a single prioritized list of actions the user can take,
          spanning both levers: improving the score (from the report card) and
          reducing interest (from recommended switches).
        items:
          $ref: '#/definitions/credit-report-service_internal_service.Recommendation'
        type: array
      reportCard:
        $ref: '#/definitions/credit-report-service_internal_service.ReportCard'
      reportId:
        type: integer
      scoreBuilder:
        allOf:
        - $ref: '#/definitions/credit-report-service_internal_service.ScoreBuilder'
        description: |-
          ScoreBuilder is the credit-score diagnosis + rebuild plan (Journey 05·C):
          journey classification, a realistic target, the positives on file, what's
          dragging the score, and a toolkit of strategies to raise it.
      totalAccountCount:
        type: integer
      totalOutstandingAmount:
        type: number
    type: object
  credit-report-service_internal_service.ReportPage:
    properties:
      items:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.ReportSummary'
        type: array
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  credit-report-service_internal_service.ReportSummary:
    properties:
      createdAt:
        type: string
      creditScore:
        type: integer
      id:
        type: integer
    type: object
  credit-report-service_internal_service.ScoreBuilder:
    properties:
      currentScore:
        type: integer
      disclaimer:
        type: string
      drivers:
        description: Drivers are the factors dragging the score down (weakest first).
        items:
          $ref: '#/definitions/credit-report-service_internal_service.ScoreDriver'
        type: array
      headline:
        type: string
      journey:
        description: |-
          Journey is "rebuild" (< 650), "blended" (650–749), "protect" (>= 750), or
          "unknown" (no score on file).
        type: string
      positives:
        description: Positives are the reassuring facts found on the file (no defaults,
          etc.).
        items:
          type: string
        type: array
      strategies:
        description: Strategies is the rebuild/optimize toolkit, highest-impact first.
        items:
          $ref: '#/definitions/credit-report-service_internal_service.BuilderStrategy'
        type: array
      targetScoreMax:
        type: integer
      targetScoreMin:
        type: integer
      timelineMonthsMax:
        type: integer
      timelineMonthsMin:
        description: |-
          TimelineMonthsMin/Max bound a realistic time-to-target (0 when the plan is
          "maintain", i.e. already at target).
        type: integer
    type: object
  credit-report-service_internal_service.ScoreDriver:
    properties:
      factor:
        type: string
      grade:
        type: string
      summary:
        type: string
    type: object
  credit-report-service_internal_service.SessionView:
    properties:
      current:
        description: |-
          Current marks the session the requesting device is using right now, so
          the UI can label it and warn before revoking it.
        type: boolean
      deviceInfo:
        allOf:
        - $ref: '#/definitions/credit-report-service_internal_models.DeviceMeta'
        description: |-
          DeviceInfo is the make/model/OS breakdown, split into what the client
          declared and what the server parsed from the User-Agent.
      deviceName:
        type: string
      expiresAt:
        type: string
      id:
        type: integer
      ip:
        type: string
      lastUsedAt:
        type: string
      platform:
        type: string
      signedInAt:
        type: string
    type: object
  credit-report-service_internal_service.SignupResult:
    properties:
      accountId:
        type: integer
      email:
        type: string
      message:
        type: string
    type: object
  credit-report-service_internal_service.SimAction:
    properties:
      delta:
        description: signed score impact when selected
        type: integer
      direction:
        description: '"up" (positive) | "down" (negative)'
        type: string
      key:
        type: string
      kind:
        description: '"advice" | "product" | "event"'
        type: string
      label:
        type: string
      selected:
        description: ✓ selected (counts toward projection) vs ○ not
        type: boolean
    type: object
  credit-report-service_internal_service.Simulation:
    properties:
      actions:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.SimAction'
        type: array
      currentScore:
        type: integer
      delta:
        description: projected - current (sum of selected action deltas)
        type: integer
      disclaimer:
        type: string
      projectedScore:
        type: integer
      timeframe:
        type: string
    type: object
  credit-report-service_internal_service.SwitchOpportunities:
    properties:
      creditScore:
        type: integer
      disclaimer:
        type: string
      opportunities:
        items:
          $ref: '#/definitions/credit-report-service_internal_service.SwitchOpportunity'
        type: array
      recommendedCount:
        type: integer
      recoveryWindowMonths:
        type: integer
      reportId:
        type: integer
      totalMonthlyEmiSaving:
        type: number
      totalNetSaving:
        type: number
    type: object
  credit-report-service_internal_service.SwitchOpportunity:
    properties:
      accountNumber:
        type: string
      bestProvider:
        $ref: '#/definitions/credit-report-service_internal_models.LoanProvider'
      currentEmi:
        type: number
      currentLender:
        type: string
      currentRatePercent:
        type: number
      foreclosureFee:
        type: number
      loanType:
        description: HOME | PERSONAL | CAR
        type: string
      monthlyEmiSaving:
        type: number
      netSaving:
        type: number
      newEmi:
        type: number
      newRatePercent:
        type: number
      outstandingBalance:
        type: number
      processingFee:
        type: number
      reason:
        type: string
      recommended:
        type: boolean
      recoveryMonths:
        type: integer
      remainingTenureMonths:
        type: integer
      status:
        description: |-
          Status: "recommended" | "not_recommended" | "no_better_offer" |
          "insufficient_data". Reason explains the non-recommended cases.
        type: string
      switchingCost:
        type: number
      totalInterestSaving:
        type: number
    type: object
  internal_handler.createCouponReq:
    properties:
      code:
        example: SAVE20
        type: string
      discountPercent:
        example: 20
        type: number
      maxRedemptions:
        example: 100
        type: integer
      perAccountLimit:
        example: 1
        type: integer
      productCode:
        example: CREDIT_ANALYSIS
        type: string
      validFrom:
        example: "2026-08-01T00:00:00Z"
        type: string
      validUntil:
        example: "2026-12-31T23:59:59Z"
        type: string
    type: object
  internal_handler.createOrderReq:
    properties:
      couponCode:
        description: |-
          CouponCode is optional. Only the code is accepted — the discount and the
          resulting total are computed server-side from the catalog price, so a
          tampered request cannot change what is charged.
        example: SAVE20
        type: string
      productCode:
        example: CREDIT_ANALYSIS
        type: string
    type: object
  internal_handler.googleLoginReq:
    properties:
      idToken:
        example: eyJhbGciOiJSUzI1NiIs...
        type: string
      referralCode:
        description: ReferralCode is only honoured when this login creates a new account.
        example: REF-7K2QM4XZ
        type: string
    type: object
  internal_handler.loginReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: hunter2pass
        type: string
    type: object
  internal_handler.offeringReq:
    properties:
      active:
        example: true
        type: boolean
      applyUrl:
        example: https://apply.example.com/hdfc-fd-card
        type: string
      estimatedPointsMax:
        example: 80
        type: integer
      estimatedPointsMin:
        example: 40
        type: integer
      interestRatePercent:
        example: 7
        type: number
      maxCreditScore:
        example: 650
        type: integer
      minCreditScore:
        example: 0
        type: integer
      minFdAmount:
        example: 15000
        type: number
      name:
        example: HDFC Millennia FD-Backed Card
        type: string
      productType:
        example: FD_CARD
        type: string
      revenueNote:
        example: FD + secured-card referral
        type: string
    type: object
  internal_handler.providerReq:
    properties:
      active:
        example: true
        type: boolean
      interestRatePercent:
        example: 7.2
        type: number
      loanType:
        example: HOME
        type: string
      maxTenureMonths:
        example: 360
        type: integer
      minCreditScore:
        example: 750
        type: integer
      name:
        example: HDFC Bank
        type: string
      processingFeeFlat:
        example: 3000
        type: number
      processingFeePercent:
        example: 0.5
        type: number
    type: object
  internal_handler.refreshReq:
    properties:
      refreshToken:
        example: rt_8Kx3...
        type: string
    type: object
  internal_handler.resendReq:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  internal_handler.setRoleReq:
    properties:
      role:
        example: agent
        type: string
    type: object
  internal_handler.settingsReq:
    properties:
      foreclosureFeePercentCar:
        example: 4
        type: number
      foreclosureFeePercentHome:
        example: 0
        type: number
      foreclosureFeePercentPersonal:
        example: 4
        type: number
      recoveryWindowMonths:
        example: 12
        type: integer
    type: object
  internal_handler.signupReq:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: hunter2pass
        type: string
      referralCode:
        description: |-
          ReferralCode is optional and attributes the new account to whoever owns
          it. An invalid code fails the signup rather than being ignored.
        example: REF-7K2QM4XZ
        type: string
    type: object
  internal_handler.submitPanReq:
    properties:
      pan:
        example: ABCDE1234F
        type: string
    type: object
  internal_handler.updateProfileReq:
    properties:
      dateOfBirth:
        example: "1815-12-10"
        type: string
      firstName:
        example: Ada
        type: string
      lastName:
        example: Lovelace
        type: string
    type: object
  internal_handler.verifyEmailReq:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "123456"
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    REST API for the credit-report Android app: email/password auth with OTP verification, JWT sessions, profile management, and credit-report CRUD.

    All routes are mounted under `/api`. Protected routes require an `Authorization: Bearer <jwt>` header obtained from login or email verification.
  title: Credit Report Service API
  version: "1.0"
paths:
  /admin/accounts/{accountId}/role:
    put:
      consumes:
      - application/json
      description: Grants or revokes a role. 'agent' lets the account issue coupon
        codes; 'user' is the default. Note that the role rides in the JWT, so a change
        only takes effect for the target account on its next token refresh — up to
        one access-token lifetime later.
      parameters:
      - description: Account to modify
        in: path
        name: accountId
        required: true
        type: integer
      - description: Role to set (user | agent | admin)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.setRoleReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/credit-report-service_internal_models.Account'
        "400":
          description: Unknown role / accountId must be an integer
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "401":
          description: Not authenticated
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "403":
          description: Missing the 'account:set-role' permission
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
        "404":
          description: Account not found
          schema:
            $ref: '#/definitions/credit-report-service_internal_apperr.ErrorBody'
      security:
      - BearerAuth: []
      summary: Set an account's role
      tags:
      - admin
  /admin/bank-offerings:
    get:
