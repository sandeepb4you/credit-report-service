# /etc/nginx/sites-available/api.myscorr.com
# certbot --nginx adds the 443 server block and the http->https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.myscorr.com;

    # Matches multipart.max-request-size (12MB) in config.yaml: a 10MB Loan
    # Assist document plus its multipart envelope.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Digitap/report pulls can be slow; don't cut them off at nginx's 60s default.
        proxy_read_timeout 120s;
    }
}
