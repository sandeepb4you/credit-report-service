# /etc/nginx/conf.d/www.myscorr.com.conf on the server
# Two roots, both deployed by the frontend repo's deploy-web.sh: the marketing
# site at /var/www/myscorr and the Compose app at /var/www/myscorr/app.
# certbot --nginx adds TLS.
#
# DO NOT scp THIS FILE OVER THE LIVE ONE. certbot appended the 443 listeners,
# the certificate paths and the http->https redirects directly into the server's
# copy, and none of that is reproduced here. Overwriting wholesale strips the TLS
# blocks, so HTTPS for www.myscorr.com falls through to the API's server block
# and the whole site answers 404 application/json. (Done once, 2026-08-26.)
#
# Apply changes by editing the live file in place, then `nginx -t` before
# `nginx -s reload`, and keep this file updated to match.

# www -> apex. The canonical host is the bare domain; the certificate covers
# api, apex and www, so either could serve and only one should.
server {
    listen 80;
    listen [::]:80;
    server_name www.myscorr.com;
    return 301 https://myscorr.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name myscorr.com;

    root /var/www/myscorr;
    index index.html;

    # Kotlin/JS emits ES modules (.mjs) alongside a Skia wasm blob, and the
    # nginx mime.types bundled on this box (1.30.4) maps NEITHER extension — so
    # both were served as application/octet-stream. That is fatal rather than
    # untidy: a browser refuses to execute an ES module whose MIME type is not a
    # JavaScript one, so webApp.js could never import skiko.mjs and the page sat
    # on its loading spinner forever while every asset returned a healthy 200.
    #
    # default_type rather than a types{} block: a nested types{} REPLACES the
    # inherited map for its context, which would strip the type off everything
    # else. default_type only fills in where the map has no entry, which is
    # exactly these two extensions.
    #
    # These must precede the generic html|js|map block below — nginx takes the
    # first matching regex location, so a later, more specific one never runs.
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    # The Kotlin/JS bundle keeps a fixed filename (no content hash), so force
    # revalidation on html/js; nginx's ETag turns unchanged fetches into 304s.
    location ~* \.(html|js|map)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Renamed to /privacy-policy. Kept because the old path was live and may
    # have been linked or indexed; a 301 moves that on rather than 404ing it.
    location = /app-privacy-policy {
        return 301 /privacy-policy;
    }

    location = /app {
        return 301 /app/;
    }

    # The marketing site owns "/" and the Compose app is served under "/app/".
    #
    # They cannot share a document root: the app addresses its screens with URL
    # FRAGMENTS (/app/#login, /app/#home — see BrowserNavigation), so every route
    # it has resolves to a single index.html at the path its shell sits at.
    # Marketing needs an index.html of its own at the root, and there is one root.
    #
    # The trailing slash is load-bearing: a plain "/app" prefix would also match
    # /app-privacy-policy and hand a legal page to the Compose app.
    #
    # Deliberately NOT "^~". That would stop nginx checking the regex locations
    # above, and .mjs/.wasm would lose their MIME types — fatal rather than
    # untidy, since a browser refuses to execute an ES module served as
    # application/octet-stream, and the app would sit on its spinner forever.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # $uri.html is what gives the legal pages extensionless URLs
    # (/terms-conditions). $uri still comes first, so any URL already shared as
    # .html keeps working. No SPA fallback: an unknown path under the marketing
    # site is a 404, not a silent redirect to the homepage.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
