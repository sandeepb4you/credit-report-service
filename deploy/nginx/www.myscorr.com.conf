# /etc/nginx/conf.d/www.myscorr.com.conf on the server
# Static Kotlin/JS web app, rsynced to /var/www/myscorr by the frontend repo's
# deploy-web.sh. certbot --nginx adds TLS.
#
# DO NOT scp THIS FILE OVER THE LIVE ONE. certbot appended the 443 listeners,
# the certificate paths and the http->https redirects directly into the server's
# copy, and none of that is reproduced here. Overwriting wholesale strips the TLS
# blocks, so HTTPS for www.myscorr.com falls through to the API's server block
# and the whole site answers 404 application/json. (Done once, 2026-08-26.)
#
# Apply changes by editing the live file in place, then `nginx -t` before
# `nginx -s reload`, and keep this file updated to match.

# Apex -> www
server {
    listen 80;
    listen [::]:80;
    server_name myscorr.com;
    return 301 https://www.myscorr.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.myscorr.com;

    root /var/www/myscorr;
    index index.html;

    # Kotlin/JS emits ES modules (.mjs) alongside a Skia wasm blob, and the
    # nginx mime.types bundled on this box (1.30.4) maps NEITHER extension — so
    # both were served as application/octet-stream. That is fatal rather than
    # untidy: a browser refuses to execute an ES module whose MIME type is not a
    # JavaScript one, so webApp.js could never import skiko.mjs and the page sat
    # on its loading spinner forever while every asset returned a healthy 200.
    #
    # default_type rather than a types{} block: a nested types{} REPLACES the
    # inherited map for its context, which would strip the type off everything
    # else. default_type only fills in where the map has no entry, which is
    # exactly these two extensions.
    #
    # These must precede the generic html|js|map block below — nginx takes the
    # first matching regex location, so a later, more specific one never runs.
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache";
    }

    # The Kotlin/JS bundle keeps a fixed filename (no content hash), so force
    # revalidation on html/js; nginx's ETag turns unchanged fetches into 304s.
    location ~* \.(html|js|map)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri /index.html;
    }
}
