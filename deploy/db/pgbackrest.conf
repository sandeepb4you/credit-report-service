[global]
# S3, reached with the EC2 instance role — no keys on the box, nothing to rotate.
repo1-type=s3
repo1-s3-bucket=myscorr-db-backups
repo1-s3-endpoint=s3.ap-south-1.amazonaws.com
repo1-s3-region=ap-south-1
repo1-s3-key-type=auto
repo1-path=/pgbackrest

# The bucket's policy REFUSES an upload that does not name a KMS key, so this is
# not decoration: relying on the bucket's default encryption would send no
# header at all, the policy's condition would not match, and every archive-push
# would be denied.
repo1-s3-kms-key-id=3cbf65bb-dd8a-465a-a3e3-91406e6f65e2

# Retention is the bucket's lifecycle rule (35 days), not pgBackRest's expire.
# The instance is denied s3:DeleteObject on purpose — an attacker with the box
# must not be able to erase the backups with the same credentials — so nothing
# here can delete, and `pgbackrest expire` would only fail. The consequence to
# know: `pgbackrest info` will keep listing backups that S3 has already expired,
# and restoring one of those fails. Anything inside 35 days is real.
#
# It is also why every base backup is FULL rather than incremental. An
# incremental chain whose full has expired is unusable, and lifecycle expiry
# cannot tell that the full is still someone's ancestor. At 10 MB a full backup
# costs nothing to take, so the safe shape is the cheap one.

# Compression: the repo is tiny either way, but this cuts the WAL stream.
compress-type=zst
compress-level=3

# Keep two attempts' worth of detail for when something does go wrong.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# One process: this is a 10 MB database on a t2.medium, and parallelism here
# would only take CPU from the API sharing the box.
process-max=1

[myscorr]
pg1-path=/var/lib/postgresql/data
# This cluster has no `postgres` role or database — POSTGRES_USER/POSTGRES_DB
# named them `scorr` and `credit` when it was initialised — and pgBackRest's
# defaults assume the conventional pair. Without these it cannot connect at all,
# and reports it as "unable to find primary cluster", which reads like a
# replication problem rather than a missing role.
pg1-user=scorr
pg1-database=credit
